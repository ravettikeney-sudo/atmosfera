const STOPW = /^(понедельник|вторник|сред|четверг|пятниц|суббот|воскресен|выходн|течени|ближайш|завтра|послезавтра|сегодня|улиц|мен|нас|дом|город|утр|вечер|ноч|день|недел|сейчас|зонт|прогулк|работ|машин|дорог|море|дач)/i;
function parseAsk(q){
  const low = q.toLowerCase();
  let day = 0, range = null;
  if(/послезавтра/.test(low)) day = 2; else if(/завтра/.test(low)) day = 1;
  else if(/выходн/.test(low)) range = "weekend";
  else { const WD = [["понедельник",1],["вторник",2],["сред",3],["четверг",4],["пятниц",5],["суббот",6],["воскресен",0]]; for(const [k,v] of WD) if(low.includes(k)){ day = {wd:v}; break; } }
  if(/недел/.test(low)) range = "week";
  const topic = /гроз/.test(low) ? "storm" : /снег|снеж/.test(low) ? "snow" : /дожд|зонт|осадк|мокр|ливн/.test(low) ? "rain" : /ветер|ветр/.test(low) ? "wind" : /одет|надет|одева|куртк/.test(low) ? "wear" : /давлен/.test(low) ? "press" : /температур|градус|холод|тепл|жарк|мороз/.test(low) ? "temp" : "all";
  let city = null;
  for(const m of q.matchAll(/(?:^|\s)(?:в|во|на|для|у)\s+([A-Za-zА-Яа-яЁё-]+(?:[\s-][А-ЯЁA-Z][a-zа-яё-]+)?)/g)) if(!STOPW.test(m[1])){ city = m[1].replace(/[?.!,]+$/,""); break; }
  if(!city){ const m = q.match(/(?:погода|погоду)\s+([А-ЯЁA-Z][a-zа-яё-]+)/); if(m) city = m[1]; }
  return {day, range, topic, city};
}
function cityVariants(w){
  const s = w.trim(), v = [s];
  for(const [r, rep] of [[/ске$/,"ск"],[/ве$/,"ва"],[/не$/,"на"],[/ле$/,"ль"],[/е$/,"а"],[/е$/,""],[/и$/,"ь"],[/и$/,"а"],[/и$/,"ы"],[/у$/,"а"],[/ах$/,"ы"],[/ях$/,"и"],[/ом$/,""]]) if(r.test(s)) v.push(s.replace(r, rep));
  return [...new Set(v)];
}
async function findCity(w){
  for(const v of cityVariants(w)){
    try{
      const d = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=5&language=ru&format=json`, 8000, 1);
      const r = (d.results||[]).filter(x => x.name.toLowerCase() === v.toLowerCase()).sort((a,b) => (b.population||0) - (a.population||0))[0];
      if(r) return r;
    }catch(e){}
  }
  return null;
}
function composeAnswer(p, w, name){
  const d = w.daily, c = w.current, today = new Date(d.time[0]+"T12:00:00");
  let idx;
  if(p.range === "weekend"){ idx = []; d.time.forEach((t,i) => { const g = new Date(t+"T12:00:00").getDay(); if((g === 6 || g === 0) && i < 8) idx.push(i); }); idx = idx.slice(0,2); }
  else if(p.range === "week") idx = [0,1,2,3,4,5,6];
  else if(typeof p.day === "object") idx = [(p.day.wd - today.getDay() + 7) % 7];
  else idx = [p.day];
  const when = i => i === 0 ? "Сегодня" : i === 1 ? "Завтра" : i === 2 ? "Послезавтра" : `В ${DOWF[new Date(d.time[i]+"T12:00:00").getDay()]}`;
  const desc = i => (WMO[d.weather_code[i]]||["—"])[0].toLowerCase();
  const parts = [];
  if(idx.length === 1 && idx[0] === 0 && (p.topic === "all" || p.topic === "temp")){
    parts.push(`Сейчас ${Tu(c.temperature_2m)}, ${(WMO[c.weather_code]||["—"])[0].toLowerCase()}, ощущается как ${Tu(c.apparent_temperature)}, ветер ${Math.round(c.wind_speed_10m)} м/с`);
    const nc = nowcast(w).text; if(nc) parts.push(nc);
  }
  for(const i of idx){
    if(i >= d.time.length) continue;
    const pr = d.precipitation_sum[i]||0, pp = d.precipitation_probability_max[i]??0, sn = d.snowfall_sum[i]||0;
    switch(p.topic){
      case "rain": parts.push(pr < 0.3 && pp < 30 ? `${when(i)} дождя не ожидается` : `${when(i)} ${pp >= 60 ? "будет" : "возможен"} дождь: ${pr.toFixed(1).replace(".",",")} мм, вероятность ${pp}%${pp >= 50 ? ". Возьмите зонт" : ""}`); if(i === 0){ const nc = nowcast(w).text; if(nc) parts.push(nc); } break;
      case "snow": parts.push(sn < 0.2 ? `${when(i)} снега не ожидается` : `${when(i)} выпадет около ${Math.max(1, Math.round(sn))} см снега`); break;
      case "wind": parts.push(`${when(i)} ветер ${dirName(d.wind_direction_10m_dominant[i])} до ${Math.round(d.wind_speed_10m_max[i])} м/с, порывы до ${Math.round(d.wind_gusts_10m_max[i])} м/с`); break;
      case "storm": parts.push(d.weather_code[i] >= 95 ? `${when(i)} ожидается гроза` : `${when(i)} гроз не ожидается`); break;
      case "press": if(i === 0) parts.push(`Давление ${Math.round(c.pressure_msl*0.750062)} мм рт. ст., ${pressureTrend(w)}`); break;
      case "wear": parts.push(i === 0 ? wearText(w)[1] : `${when(i)} днём до ${Tu(d.temperature_2m_max[i])}${pp >= 50 ? ", возьмите зонт" : ""}`); break;
      default: parts.push(`${when(i)} ${desc(i)}, днём до ${Tu(d.temperature_2m_max[i])}, ночью ${Tu(d.temperature_2m_min[i])}${pr >= 0.3 ? `, осадки ${pr.toFixed(1).replace(".",",")} мм` : ", без осадков"}`);
    }
  }
  return `${name}. ${parts.join(". ")}.`.replace(/\.\./g, ".");
}
function speak(t){
  const s = t.replace(/м\/с/g, "метров в секунду").replace(/мм рт\. ст\./g, "миллиметров ртутного столба").replace(/ мм\b/g, " миллиметров").replace(/ см\b/g, " сантиметров").replace(/%/g, " процентов").replace(/−/g, "минус ");
  try{ if(window.AtmApp?.speak){ window.AtmApp.speak(s); return; } }catch(e){}
  try{ const u = new SpeechSynthesisUtterance(s); u.lang = "ru-RU"; const v = speechSynthesis.getVoices().find(v => /^ru/i.test(v.lang)); if(v) u.voice = v; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
async function voiceAsk(text){

    }
    if(!current?.wx){ say("Не удалось получить погоду. Проверьте интернет."); return; }

/* ================= weather along a route ================= */
const rt = {from:null, to:null, drawn:false};
const hav = (a, b) => { const r = Math.PI/180, dLat = (b[1]-a[1])*r, dLon = (b[0]-a[0])*r, x = Math.sin(dLat/2)**2 + Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLon/2)**2; return 12742e3*Math.asin(Math.sqrt(x)); };
const COND = {dry:["#7ee0a0","сухо"], rain:["#4aa3ff","дождь"], snow:["#d9d4ff","снег"], ice:["#ff7ad9","гололёд"], storm:["#ff6a3d","гроза"], fog:["#c3cee0","туман"], wind:["#ffd35c","сильный ветер"]};
function renderRoute(){
  const box = $("#route");
  box.innerHTML = `<h3><span>Погода по маршруту</span><button class="mini" id="rClose" aria-label="Закрыть"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <div class="rf">
      <label>Откуда<input id="rFrom" autocomplete="off" placeholder="Город отправления"><div class="sugg" id="sFrom" hidden></div></label>
      <label>Куда<input id="rTo" autocomplete="off" placeholder="Город назначения"><div class="sugg" id="sTo" hidden></div></label>
      <label>Отправление<select id="rDep"><option value="0">Сейчас</option><option value="1">Через 1 час</option><option value="2">Через 2 часа</option><option value="3">Через 3 часа</option><option value="6">Через 6 часов</option><option value="tm">Завтра в 8:00</option></select></label>
      <button class="qbtn primary" id="rGo" style="justify-content:center">Показать погоду в пути</button>
    </div><div id="rOut"></div>`;
  const src = rt.from || (current ? {lat:current.lat, lon:current.lon, name:current.name} : favs[0] ? {lat:favs[0].lat, lon:favs[0].lon, name:favs[0].name} : null);
  if(src){ rt.from = src; $("#rFrom").value = src.name; }
  if(rt.to) $("#rTo").value = rt.to.name;
  for(const [inp, sug, key] of [["#rFrom","#sFrom","from"],["#rTo","#sTo","to"]]){
    let t = null;
    $(inp).oninput = e => { rt[key] = null; clearTimeout(t); const q = e.target.value.trim(); if(q.length < 2){ $(sug).hidden = true; return; }
      t = setTimeout(async () => {
        try{ const d = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=ru&format=json`, 8000, 1);
          const res = d.results || []; $(sug).innerHTML = res.length ? "" : `<button disabled>Ничего не найдено</button>`;
          res.forEach(r => { const b = document.createElement("button"); b.innerHTML = `${esc(r.name)} <small>${esc([r.admin1, r.country].filter(Boolean).join(", "))}</small>`;
            b.onclick = () => { rt[key] = {lat:r.latitude, lon:r.longitude, name:r.name}; $(inp).value = r.name; $(sug).hidden = true; }; $(sug).appendChild(b); });
          $(sug).hidden = false; }catch(e){}
      }, 280); };
  }
  $("#rClose").onclick = () => closeRoute();
  $("#rGo").onclick = () => buildRoute();
}
function openRoute(){ const b = $("#route"); if(!b.hidden){ closeRoute(); return; } b.hidden = false; $("#routeBtn").setAttribute("aria-expanded","true"); closeCities(); closeSettings(); renderRoute(); }
function closeRoute(){ $("#route").hidden = true; $("#routeBtn").setAttribute("aria-expanded","false"); }
function clearRoute(){ for(const id of ["rt-line-case","rt-line","rt-pts","rt-lbl"]) if(map.getLayer(id)) map.removeLayer(id); for(const id of ["rt-line","rt-pts"]) if(map.getSource(id)) map.removeSource(id); rt.drawn = false; }
async function buildRoute(){
  const f = rt.from, t = rt.to, out = $("#rOut");
  if(!f || !t){ toast("Выберите города из подсказок: начните вводить название и нажмите на нужный"); return; }
  out.innerHTML = `<div class="loading">Строю маршрут и смотрю погоду…</div>`;
  const depSel = $("#rDep").value; let dep = Date.now();
  if(depSel === "tm"){ const x = new Date(); x.setDate(x.getDate()+1); x.setHours(8,0,0,0); dep = x.getTime(); } else dep += (+depSel)*3600e3;
  let geom, dist, dur, approx = false;
  try{
    const r = await getJSON(`https://router.project-osrm.org/route/v1/driving/${f.lon},${f.lat};${t.lon},${t.lat}?overview=full&geometries=geojson`, 25000, 2);
    if(!r.routes?.length) throw new Error("no route");
    geom = r.routes[0].geometry.coordinates; dist = r.routes[0].distance; dur = r.routes[0].duration;
  }catch(e){
    approx = true; geom = []; for(let i = 0; i <= 60; i++) geom.push([f.lon + (t.lon-f.lon)*i/60, f.lat + (t.lat-f.lat)*i/60]);
    dist = hav([f.lon,f.lat],[t.lon,t.lat])*1.25; dur = dist/(70/3.6);
  }
  const cum = [0]; for(let i = 1; i < geom.length; i++) cum.push(cum[i-1] + hav(geom[i-1], geom[i]));
  const total = cum[cum.length-1] || 1, n = clamp(Math.round(total/45000) + 2, 4, 14), S = [];
  for(let k = 0; k < n; k++){ const target = total*k/(n-1); let j = cum.findIndex(c => c >= target); if(j < 0) j = geom.length-1; S.push({j, pt:geom[j], eta: dep + dur*1000*(cum[j]/total)}); }
  let wx;
  try{ wx = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${S.map(s=>s.pt[1].toFixed(3)).join(",")}&longitude=${S.map(s=>s.pt[0].toFixed(3)).join(",")}&hourly=temperature_2m,precipitation,snowfall,weather_code,wind_gusts_10m,visibility&forecast_days=3&timezone=GMT&wind_speed_unit=ms`, 20000, 2); }
  catch(e){ out.innerHTML = `<div class="err">Не удалось получить прогноз для маршрута. Попробуйте позже.</div>`; return; }
  const arr = Array.isArray(wx) ? wx : [wx];
  const names = await Promise.all(S.map((s,k) => k === 0 ? Promise.resolve({name:f.name}) : k === n-1 ? Promise.resolve({name:t.name}) : reverseName(s.pt[1], s.pt[0]).catch(() => ({name:""}))));
  S.forEach((s,k) => {
    const h = arr[k].hourly, t0 = Date.parse(h.time[0]+":00Z"), i = clamp(Math.round((s.eta - t0)/3600e3), 0, h.time.length-1);
    const T = h.temperature_2m[i], P = h.precipitation[i]||0, Sn = h.snowfall[i]||0, code = h.weather_code[i], G = h.wind_gusts_10m[i]||0, V = h.visibility?.[i];
    s.T = T; s.P = P; s.code = code; s.G = G; s.name = (names[k].name && names[k].name !== "Выбранная точка") ? names[k].name : `${Math.round(cum[s.j]/1000)}-й км`;
    s.cond = code >= 95 ? "storm" : (Sn > 0.05 || (code >= 71 && code <= 86 && code !== 80 && code !== 81 && code !== 82)) ? "snow" : P >= 0.2 ? (T <= 0.5 ? "ice" : "rain") : (code === 45 || code === 48 || (V != null && V < 1000)) ? "fog" : G >= 15 ? "wind" : "dry";
  });
  clearRoute();
  const segs = []; for(let k = 0; k < n-1; k++){ const a = S[k], b = S[k+1], worse = a.cond !== "dry" ? a.cond : b.cond; segs.push({type:"Feature", properties:{c:COND[worse][0]}, geometry:{type:"LineString", coordinates: geom.slice(a.j, b.j+1).length > 1 ? geom.slice(a.j, b.j+1) : [a.pt, b.pt]}}); }
  map.addSource("rt-line", {type:"geojson", data:{type:"FeatureCollection", features:segs}});
  map.addSource("rt-pts", {type:"geojson", data:{type:"FeatureCollection", features:S.map(s => ({type:"Feature", properties:{t:Tu(s.T), c:COND[s.cond][0]}, geometry:{type:"Point", coordinates:s.pt}}))}});
  map.addLayer({id:"rt-line-case", type:"line", source:"rt-line", layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":"rgba(5,10,30,.75)","line-width":9}});
  map.addLayer({id:"rt-line", type:"line", source:"rt-line", layout:{"line-cap":"round","line-join":"round"}, paint:{"line-color":["get","c"],"line-width":5}});
  map.addLayer({id:"rt-pts", type:"circle", source:"rt-pts", paint:{"circle-radius":6,"circle-color":["get","c"],"circle-stroke-color":"#fff","circle-stroke-width":2}});
  map.addLayer({id:"rt-lbl", type:"symbol", source:"rt-pts", layout:{"text-field":["get","t"],"text-font":["Noto Sans Bold"],"text-size":12,"text-offset":[0,-1.3]}, paint:{"text-color":"#fff","text-halo-color":"rgba(5,7,13,.9)","text-halo-width":1.5}});
  rt.drawn = true;
  const lons = geom.map(g=>g[0]), lats = geom.map(g=>g[1]);
  stopSpin(); map.fitBounds([[Math.min(...lons), Math.min(...lats)],[Math.max(...lons), Math.max(...lats)]], {padding: innerWidth < 760 ? {top:80, bottom:80, left:30, right:30} : {top:80, bottom:60, left:440, right:80}, pitch:0, duration:1400});
  const tm = ms => { const x = new Date(ms), sameDay = x.toDateString() === new Date().toDateString(); return (sameDay ? "" : DOW[x.getDay()] + " ") + x.toLocaleTimeString("ru", {hour:"2-digit", minute:"2-digit"}); };
  const issues = []; let k = 0;
  while(k < n){ if(S[k].cond === "dry"){ k++; continue; } let e = k; while(e+1 < n && S[e+1].cond === S[k].cond) e++; issues.push(`<span class="chipline" style="background:${COND[S[k].cond][0]}"></span>${COND[S[k].cond][1][0].toUpperCase()+COND[S[k].cond][1].slice(1)}: ${esc(S[k].name)}${e > k ? ` — ${esc(S[e].name)}` : ""} (${tm(S[k].eta)}${e > k ? `–${tm(S[e].eta)}` : ""})`); k = e+1; }
  const cold = S.reduce((m,s) => s.T < m.T ? s : m), gust = Math.max(...S.map(s => s.G));
  const h = Math.floor(dur/3600), mi = Math.round(dur%3600/60);
  out.innerHTML = `<div class="rsum"><b>${Math.round(total/1000)} км · в пути ~${h ? h+" ч " : ""}${mi} мин</b>
    ${issues.length ? issues.join("<br>") : `<span class="chipline" style="background:${COND.dry[0]}"></span>Весь путь без осадков`}
    <br>Холоднее всего: ${esc(cold.name)}, ${Tu(cold.T)} · порывы ветра до ${Math.round(gust)} м/с
    ${approx ? `<br><small style="color:var(--muted)">Дорожный маршрут не построился, показан прямой путь.</small>` : ""}</div>
    <div class="rlist">${S.map(s => `<div class="rrow"><span class="rt">${tm(s.eta)}</span>${icon(s.code, 1, 24)}<span class="rn"><b>${esc(s.name)}</b><small>${COND[s.cond][1]}${s.P >= 0.2 ? `, ${s.P.toFixed(1)} мм/ч` : ""}${s.G >= 12 ? `, порывы ${Math.round(s.G)} м/с` : ""}</small></span><span class="rv" ${tcs(s.T)}>${Tu(s.T)}</span></div>`).join("")}</div>
    <button class="qbtn" id="rClear" style="width:100%;margin-top:10px">Убрать маршрут с карты</button>`;
  $("#rClear").onclick = () => { clearRoute(); $("#rOut").innerHTML = ""; };
}
$("#routeBtn").onclick = e => { e.stopPropagation(); openRoute(); };

/* ================= globe controls ================= */
let spinning = store.get("spin", true), userBusy=false;
function spinStep(){
  if(!spinning || userBusy || map.getZoom()>3 || wx.active) return;
  const c = map.getCenter(); c.lng -= 6;
  map.easeTo({center:c, duration:1000, easing:n=>n});
}
map.on("moveend", () => { if(spinning && !userBusy) spinStep(); });
map.on("mousedown", ()=>{userBusy=true}); map.on("touchstart", ()=>{userBusy=true});
map.on("mouseup", ()=>{userBusy=false}); map.on("touchend", ()=>{userBusy=false});
function stopSpin(){ spinning=false; $("#spin").setAttribute("aria-pressed","false"); store.set("spin",false); }
$("#spin").setAttribute("aria-pressed", spinning);
$("#spin").onclick = () => { spinning=!spinning; $("#spin").setAttribute("aria-pressed",spinning); store.set("spin",spinning); if(spinning) spinStep(); };
$("#home").onclick = () => { if(wx.active) closeWx(true); map.flyTo({zoom: innerWidth<760?0.9:1.6, pitch:0, bearing:0, duration:1500, padding:{top:0,bottom:0,left:0,right:0}}); };
$("#units").textContent = "°"+units;
$("#units").onclick = () => { units = units==="C"?"F":"C"; store.set("units",units); syncApp(); if(peek.data) renderPeek(); $("#units").textContent="°"+units; if(current?.wx) renderWeather(); if(on.temps) showTemps(); };

$("#close").onclick = () => { $("#sheet").hidden=true; document.body.classList.remove("sheet-open","sheet-min"); if(pin){pin.remove();pin=null;} current=null; sound.update(); map.easeTo({padding:{top:0,bottom:0,left:0,right:0}, duration:500}); setTimeout(()=>peekUpdate(true), 600); };
$("#grab").onclick = () => { const s=$("#sheet"); s.classList.toggle("min"); document.body.classList.toggle("sheet-min", s.classList.contains("min")); peekUpdate(true); };

map.on("click", e => { if(wx.active) return; if(evClick(e)) return; openPlace(e.lngLat.lat, e.lngLat.lng); });
map.on("moveend", () => { const c=map.getCenter(); store.set("center",[+c.lng.toFixed(2), +c.lat.toFixed(2)]); });
/* keep the tool column above the weather-map panel whatever its height */
if(window.ResizeObserver) new ResizeObserver(() => { if(!$("#wxpanel").hidden) document.documentElement.style.setProperty("--wxh", $("#wxpanel").offsetHeight+"px"); }).observe($("#wxpanel"));
/* flash a highlight on whatever was pressed (quick taps on phones are too short for :active) */
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("button,[role=button],.mc"); if(!el || el.disabled) return;
  el.classList.add("tap"); const off = () => setTimeout(() => el.classList.remove("tap"), 180); setTimeout(() => el.classList.remove("tap"), 700);
  el.addEventListener("pointerup", off, {once:true}); el.addEventListener("pointercancel", off, {once:true}); el.addEventListener("pointerleave", off, {once:true});
}, {passive:true});
/* Android back button (APK shell calls this): close the topmost panel; return true if something was closed */
window.atmBack = () => {
  if(!$("#results").hidden){ hideResults(); return true; }
  if(!$("#voice").hidden){ $("#vClose").click(); return true; }
  if(!$("#route").hidden){ closeRoute(); return true; }
  if(!$("#cities").hidden){ closeCities(); return true; }
  if($("#hBack")){ renderWeather(); return true; }
  if(!$("#settings").hidden){ closeSettings(); return true; }
  if($("#mBack")){ renderWeather(); return true; }
  if(!$("#layers").hidden){ $("#layers").hidden = true; $("#layersBtn").setAttribute("aria-expanded","false"); return true; }
  if(wx.active){ closeWx(false); return true; }
  if(!$("#sheet").hidden){ $("#close").click(); return true; }
  return false;
};
addEventListener("keydown", e => { if(e.key==="Escape"){ if(wx.active) closeWx(false); else if(!$("#sheet").hidden) $("#close").click(); } });

map.on("load", () => {
  buildMapLayers(); renderLayerUI(); renderFavs(); syncApp();
  if(!favs.length) setTimeout(() => peekUpdate(true), 1200);
  if(favs.length){ const f = favs[0]; setTimeout(() => openPlace(f.lat, f.lon, {name:f.name, sub:f.sub, zoom:6}), 500); }
  else if(spinning) setTimeout(spinStep, 800);
  setTimeout(()=>{ $("#hint").style.opacity=0; }, 9000);
});
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
map.on("error", () => { /* tile errors are expected at satellite disc edges; ignore */ });
</script>
