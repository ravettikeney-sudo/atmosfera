<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Атмосфера — погода на 3D-глобусе</title>
<meta name="description" content="Точная погода в любой точке планеты на интерактивном 3D-глобусе: прогноз на 16 дней, карта осадков, радар, живые спутниковые снимки облаков и звуки погоды.">
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%230b1c33' stroke='%237cc4ff' stroke-width='4'/%3E%3Cpath d='M10 36c8-6 16 6 24 0s14-8 20-2' fill='none' stroke='%23ffb35c' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
/* Layout: full-bleed globe in space; search top-left, layer dock bottom-left, tool column bottom-right,
   weather sheet right (desktop) / bottom sheet (phone); "weather map" mode swaps the sheet for a timeline panel. */
:root{
  --space:#05070d; --panel:rgba(12,17,28,.86); --panel-solid:#0c111c; --raise:rgba(255,255,255,.045); --line:rgba(150,180,220,.16);
  --fg:#e8eef8; --muted:#8fa0b8; --ice:#7cc4ff; --sun:#ffb35c; --rain:#4aa3ff; --snow:#d9d4ff; --warn:#ff7a59;
  --display:"Unbounded","Onest",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--space);color:var(--fg);font:15px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{background:rgba(5,7,13,.6)!important;color:var(--muted)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-bottom-right{margin-bottom:env(safe-area-inset-bottom,0px)}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}

/* ---- top bar ---- */
.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));z-index:5;display:flex;gap:8px;align-items:flex-start;width:min(440px,calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)))}
.brand{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:14px;font:700 13px var(--display);letter-spacing:.04em;white-space:nowrap}
.brand svg{flex:none}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:46px;padding:0 44px 0 16px;border-radius:14px;outline:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--ice)}
.icon-btn{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;flex:none;padding:0}
.icon-btn:hover{border-color:var(--ice)}
.icon-btn[aria-pressed="true"]{border-color:var(--ice);color:var(--ice);background:rgba(124,196,255,.16)}
.search .locate{position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;background:transparent;display:grid;place-items:center;border-radius:10px}
.search .locate:hover{background:rgba(124,196,255,.12)}
.results{position:absolute;top:52px;left:0;right:0;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.results button{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:10px 14px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.active{background:rgba(124,196,255,.1)}
.results small{color:var(--muted)}
.favs{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--ice)}

/* ---- layer dock ---- */
.dock{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.layers{border-radius:16px;padding:10px;width:min(300px,calc(100vw - 24px));max-height:min(62vh,540px);overflow:auto}
.layers h3{margin:4px 6px 8px;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.layer{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:10px;background:none;text-align:left}
.layer:hover{background:rgba(124,196,255,.08)}
.layer .sw{width:34px;height:34px;border-radius:9px;flex:none;border:1px solid var(--line)}
.layer b{display:block;font-weight:600;font-size:14px}
.layer small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.layer[aria-pressed="true"]{background:rgba(124,196,255,.14)}
.layer[aria-pressed="true"] .sw{border-color:var(--ice);box-shadow:0 0 0 2px rgba(124,196,255,.35)}
.layer .chk{margin-left:auto;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.layer[aria-pressed="true"] .chk{background:var(--ice);border-color:var(--ice)}
.layer[aria-pressed="true"] .chk::after{content:"";width:8px;height:5px;border:2px solid #05070d;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.sep{height:1px;background:var(--line);margin:8px 4px}
.stamp{font:12px var(--mono);color:var(--muted);padding:2px 8px 4px}
.timeline{display:flex;align-items:center;gap:10px;border-radius:14px;padding:8px 12px;width:min(340px,calc(100vw - 24px))}
.timeline input{flex:1;accent-color:var(--rain);min-width:0}
.timeline span{font:600 13px var(--mono);min-width:56px;text-align:right}
.play{width:36px;height:36px;border-radius:50%;border:0;background:var(--rain);color:#05070d;display:grid;place-items:center;flex:none;padding:0}
.legend{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--muted);padding:0 8px 6px}
.legend i{flex:1;height:6px;border-radius:3px}

/* ---- tool column ---- */
.toolbar{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;gap:8px}
body.sheet-open .toolbar{right:calc(444px + env(safe-area-inset-right,0px))}
.toolbar .icon-btn{width:44px;height:44px;border-radius:13px}
.unit-toggle{font:600 13px var(--mono)}

/* ---- weather sheet ---- */
.sheet{position:fixed;z-index:6;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:420px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{padding:18px 18px 12px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.grab{display:none}
.place{flex:1;min-width:0}
.place h2{margin:0;font:700 19px/1.2 var(--display);text-wrap:balance;overflow-wrap:anywhere}
.place p{margin:4px 0 0;color:var(--muted);font-size:13px}
.coords{font:12px var(--mono);color:var(--muted)}
.head-actions{display:flex;gap:6px}
.head-actions .icon-btn{width:38px;height:38px;border-radius:11px}
.star[aria-pressed="true"] svg{fill:var(--sun);stroke:var(--sun)}
.sheet-body{overflow:auto;padding:0 18px 18px;flex:1;overscroll-behavior:contain}
.now{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;padding:18px 0 10px}
.now .big{font:500 64px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.now .wx-ico{width:64px;height:64px}
.now .desc{grid-column:1/-1;font-size:16px;font-weight:600}
.now .feel{grid-column:1/-1;color:var(--muted);font-size:14px}
.localtime{font:13px var(--mono);color:var(--muted)}
.nowcast{margin:6px 0 4px;padding:12px 14px;border-radius:14px;background:var(--raise);border:1px solid var(--line)}
.nowcast b{display:block;font:600 16px/1.3 var(--body);text-wrap:balance}
.ncbars{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:10px}
.ncbars i{flex:1;border-radius:2px 2px 0 0;min-height:2px;background:rgba(150,180,220,.18)}
.ncaxis{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);margin-top:4px}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 4px}
.qbtn{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:14px;font-weight:500}
.qbtn:hover{border-color:var(--ice)}
.qbtn.primary{background:var(--ice);border-color:var(--ice);color:#05070d;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.answer{margin-top:8px;padding:12px 14px;border-radius:14px;background:rgba(124,196,255,.08);border:1px solid rgba(124,196,255,.25);font-size:14px}
.answer b{display:block;margin-bottom:2px}
.section{padding:14px 0;border-top:1px solid var(--line);margin-top:10px}
.section h4{margin:0 0 10px;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section h4 span{text-transform:none;letter-spacing:0;font:12px var(--mono)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.cell small{display:block;color:var(--muted);font-size:12px}
.cell b{display:block;font:600 18px var(--mono);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell em{display:block;font-style:normal;color:var(--muted);font-size:12px}
.wind-arrow{display:inline-block}
.hourly{overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:thin}
.hourly svg{display:block}
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:62px 28px minmax(0,1fr) 52px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.day:last-child{border-bottom:0}
.day.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:rgba(124,196,255,.18)}100%{background:transparent}}
.day .dname{font-weight:600;font-size:14px}
.day .dname small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.day .range{display:flex;align-items:center;gap:8px;font:13px var(--mono)}
.day .range .lo{color:var(--muted);width:32px;text-align:right}
.day .range .hi{width:32px}
.bar{position:relative;flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.07)}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.day .pr{font:12px var(--mono);color:var(--rain);text-align:right}
.day .pr small{display:block;color:var(--muted)}
.aqi{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.aqi .dot{width:14px;height:14px;border-radius:50%}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.err{padding:14px;border-radius:12px;background:rgba(255,122,89,.1);border:1px solid rgba(255,122,89,.35);color:#ffc2b1;margin-top:14px}
.err button{margin-top:8px;padding:6px 12px;border-radius:8px;border:1px solid currentColor;background:none}

/* ---- weather map mode ---- */
.wxpanel{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));border-radius:20px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px}
.wx-head{display:flex;align-items:flex-start;gap:12px}
.wx-head .t{flex:1;min-width:0}
.wx-head h3{margin:0;font:700 16px/1.25 var(--display);overflow-wrap:anywhere}
.wx-head p{margin:4px 0 0;font-size:14px;font-weight:600;text-wrap:balance}
.wx-head .icon-btn{width:38px;height:38px;border-radius:11px}
.wx-time{display:flex;align-items:center;gap:12px}
.wx-time input{flex:1;accent-color:var(--ice);min-width:0}
.wx-clock{font:600 15px var(--mono);min-width:76px;text-align:right;white-space:nowrap}
.wx-ticks{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);padding:0 2px 0 50px;margin-top:-6px}
.wx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.wx-legend span{display:inline-flex;align-items:center;gap:6px}
.wx-legend i{display:inline-block;width:26px;height:8px;border-radius:4px}
.wx-toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:13px}
.tg[aria-pressed="true"]{background:rgba(124,196,255,.18);border-color:var(--ice);color:var(--fg)}
.tg[aria-pressed="false"]{color:var(--muted)}
.refresh{align-self:center;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--ice);background:rgba(124,196,255,.15)}
.wx-status{font-size:13px;color:var(--muted)}
body.wxmode .dock, body.wxmode .favs{display:none}
body.wxmode .toolbar{bottom:calc(30px + env(safe-area-inset-bottom,0px) + var(--wxh,220px))}

.temp-marker{font:600 12px var(--mono);padding:3px 7px;border-radius:999px;color:#05070d;box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer;white-space:nowrap;border:1px solid rgba(0,0,0,.25)}
.pin{width:22px;height:22px;border-radius:50%;background:var(--sun);border:3px solid #fff;box-shadow:0 0 0 6px rgba(255,179,92,.3),0 4px 10px rgba(0,0,0,.5)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:3;border-radius:999px;padding:8px 16px;font-size:13px;color:var(--muted);pointer-events:none;transition:opacity .4s;white-space:nowrap;max-width:calc(100vw - 140px);overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);width:max-content;max-width:calc(100vw - 32px)}

@media (max-width:760px){
  .brand span{display:none}
  .brand{padding:0 12px}
  .sheet{left:0;right:0;bottom:0;top:auto;width:auto;height:64vh;border-radius:22px 22px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);transition:height .3s ease}
  .sheet.min{height:170px}
  .grab{display:block;width:100%;height:20px;border:0;padding:0;background:none;position:relative}
  .grab::after{content:"";position:absolute;left:50%;top:8px;width:42px;height:5px;margin-left:-21px;border-radius:3px;background:rgba(255,255,255,.25)}
  .sheet-head{padding-top:4px}
  body.sheet-open .toolbar{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(64vh + 10px);flex-direction:row}
  body.sheet-open.sheet-min .toolbar{bottom:180px}
  body.sheet-open .dock, body.sheet-open .hint{display:none}
  .layers{max-height:52vh}
  .wxpanel{bottom:0;border-radius:22px 22px 0 0;border-bottom:0;width:100%;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body.wxmode .toolbar{bottom:calc(var(--wxh,220px) + 12px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Интерактивный глобус"></div>

<div class="top">
  <div class="brand glass" aria-label="Атмосфера">
    <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="#0b1c33" stroke="#7cc4ff" stroke-width="5"/><path d="M10 36c8-6 16 6 24 0s14-8 20-2" fill="none" stroke="#ffb35c" stroke-width="5" stroke-linecap="round"/></svg>
    <span>АТМОСФЕРА</span>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
    <div class="search">
      <input id="q" class="glass" type="search" placeholder="Город или страна" autocomplete="off" aria-label="Поиск места" role="combobox" aria-expanded="false" aria-controls="results">
      <button class="locate" id="locate" title="Моё местоположение" aria-label="Показать погоду в моём местоположении">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <div class="results" id="results" role="listbox" hidden></div>
    </div>
    <div class="favs" id="favs"></div>
  </div>
</div>

<div class="dock">
  <div class="timeline glass" id="timeline" hidden>
    <button class="play" id="play" aria-label="Воспроизвести анимацию радара"></button>
    <input type="range" id="frame" min="0" max="0" value="0" aria-label="Время снимка радара">
    <span id="frameTime">—</span>
  </div>
  <div class="layers glass" id="layers" hidden>
    <h3>Основа</h3>
    <div id="baseList"></div>
    <div class="sep"></div>
    <h3>Слои погоды</h3>
    <div id="overlayList"></div>
    <div class="legend" id="tempLegend" hidden><span>−30°</span><i id="legendBar"></i><span>+40°</span></div>
    <div class="stamp" id="satStamp"></div>
  </div>
  <button class="icon-btn glass" id="layersBtn" aria-expanded="false" aria-controls="layers" title="Слои" aria-label="Слои карты">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
  </button>
</div>

<div class="toolbar">
  <button class="icon-btn glass" id="wxBtn" title="Погода на карте" aria-label="Погода на карте" aria-pressed="false">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.5A3.5 3.5 0 0 0 7 15z"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/></svg>
  </button>
  <button class="icon-btn glass" id="sound" title="Звуки погоды" aria-label="Звуки погоды" aria-pressed="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="soundWaves" d="M17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11" opacity=".35"/></svg>
  </button>
  <button class="icon-btn glass unit-toggle" id="units" title="Единицы измерения" aria-label="Переключить градусы">°C</button>
  <button class="icon-btn glass" id="spin" title="Вращение глобуса" aria-label="Вращение глобуса" aria-pressed="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
  </button>
  <button class="icon-btn glass" id="home" title="Показать всю планету" aria-label="Показать всю планету">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
  </button>
</div>

<script>
"use strict";
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem("atm:"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("atm:"+k, JSON.stringify(v)); }catch(e){} }
};
let units = store.get("units", "C");
const T = c => c==null ? "—" : Math.round(units==="F" ? c*9/5+32 : c);
const Tu = c => c==null ? "—" : T(c)+"°";
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 4000); }
async function getJSON(url, ms=15000, tries=3){
  for(let a=1;;a++){
    const ctl = new AbortController(); const id = setTimeout(()=>ctl.abort(), ms);
    try{
      const r = await fetch(url, {signal: ctl.signal});
      if(!r.ok){ const e = new Error("HTTP "+r.status); e.retry = r.status>=500 || r.status===429; throw e; }
      return await r.json();
    }catch(e){
      if(a>=tries || e.retry===false) throw e;
      await new Promise(res=>setTimeout(res, 700*a));
    }finally{ clearTimeout(id); }
  }
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const PLAY_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const PAUSE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
$("#play").innerHTML = PLAY_ICON; $("#wxPlay").innerHTML = PLAY_ICON;

/* temperature colour scale (°C) */
const TSTOPS = [[-40,"#c7b7ff"],[-30,"#8e7cf0"],[-20,"#5a6ee8"],[-10,"#3f9de8"],[0,"#7fd6f5"],[8,"#8ee6b0"],[15,"#d9ee7a"],[22,"#ffd35c"],[28,"#ff9d4a"],[34,"#ff6a3d"],[42,"#d42c5c"]];
function tColor(c){
  if(c<=TSTOPS[0][0]) return TSTOPS[0][1];
  for(let i=1;i<TSTOPS.length;i++){ if(c<=TSTOPS[i][0]){ const [a,ca]=TSTOPS[i-1],[b,cb]=TSTOPS[i]; return mix(ca,cb,(c-a)/(b-a)); } }
  return TSTOPS[TSTOPS.length-1][1];
}
function mix(a,b,t){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const x=p(a),y=p(b); return "#"+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,"0")).join(""); }
$("#legendBar").style.background = "linear-gradient(90deg,"+TSTOPS.filter(s=>s[0]>=-30&&s[0]<=42).map(s=>s[1]).join(",")+")";

/* WMO weather codes */
const WMO = {0:["Ясно","clear"],1:["Преимущественно ясно","clear"],2:["Переменная облачность","partly"],3:["Пасмурно","cloud"],45:["Туман","fog"],48:["Туман с изморозью","fog"],51:["Слабая морось","drizzle"],53:["Морось","drizzle"],55:["Сильная морось","drizzle"],56:["Ледяная морось","drizzle"],57:["Сильная ледяная морось","drizzle"],61:["Небольшой дождь","rain"],63:["Дождь","rain"],65:["Сильный дождь","rain"],66:["Ледяной дождь","rain"],67:["Сильный ледяной дождь","rain"],71:["Небольшой снег","snow"],73:["Снег","snow"],75:["Сильный снег","snow"],77:["Снежные зёрна","snow"],80:["Небольшой ливень","rain"],81:["Ливень","rain"],82:["Сильный ливень","rain"],85:["Снегопад","snow"],86:["Сильный снегопад","snow"],95:["Гроза","storm"],96:["Гроза с градом","storm"],99:["Сильная гроза с градом","storm"]};
function icon(code, day=1, size=28){
  const k = (WMO[code]||["","cloud"])[1];
  const sun = day ? `<circle cx="24" cy="24" r="9" fill="#ffb35c"/><g stroke="#ffb35c" stroke-width="3" stroke-linecap="round"><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/></g>` : `<path d="M30 10a14 14 0 1 0 10 22 12 12 0 0 1-10-22z" fill="#c9d6ff"/>`;
  const cloud = (y=0,f="#cfd9e8") => `<path d="M14 ${38+y}h22a8 8 0 0 0 0-16 11 11 0 0 0-21-2 7 7 0 0 0-1 18z" fill="${f}"/>`;
  const drops = c => `<g stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M17 42l-2 4M25 42l-2 4M33 42l-2 4"/></g>`;
  let g;
  switch(k){
    case "clear": g = sun; break;
    case "partly": g = `<g transform="translate(-6 -6) scale(.8)">${sun}</g>`+cloud(2); break;
    case "cloud": g = cloud(-2,"#aab7c9"); break;
    case "fog": g = `<g stroke="#aab7c9" stroke-width="3.5" stroke-linecap="round"><path d="M8 18h32M5 26h38M10 34h28"/></g>`; break;
    case "drizzle": g = cloud(-6)+`<g fill="#4aa3ff"><circle cx="17" cy="42" r="2"/><circle cx="25" cy="44" r="2"/><circle cx="33" cy="42" r="2"/></g>`; break;
    case "rain": g = cloud(-6,"#9fb0c6")+drops("#4aa3ff"); break;
    case "snow": g = cloud(-6)+`<g fill="#fff"><circle cx="17" cy="42" r="2.5"/><circle cx="25" cy="45" r="2.5"/><circle cx="33" cy="42" r="2.5"/></g>`; break;
    case "storm": g = cloud(-6,"#8c99ad")+`<path d="M26 32l-6 9h5l-3 7 9-11h-5l3-5z" fill="#ffd35c"/>`; break;
  }
  return `<svg class="wx-ico" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">${g}</svg>`;
}
const DIRS = ["С","ССВ","СВ","ВСВ","В","ВЮВ","ЮВ","ЮЮВ","Ю","ЮЮЗ","ЮЗ","ЗЮЗ","З","ЗСЗ","СЗ","ССЗ"];
const dirName = d => DIRS[Math.round(d/22.5)%16];
const windWord = ms => ms<0.3?"штиль":ms<3.4?"слабый":ms<8?"умеренный":ms<10.8?"свежий":ms<13.9?"сильный":ms<17.2?"крепкий":ms<24.5?"шторм":"ураган";
const uvWord = u => u<3?"низкий":u<6?"умеренный":u<8?"высокий":u<11?"очень высокий":"экстремальный";
const fmtTime = iso => iso ? iso.slice(11,16) : "—";
const DOW = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"], DOWF = ["воскресенье","понедельник","вторник","среду","четверг","пятницу","субботу"], MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];

/* ================= map ================= */
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services";
const GIBS = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best";
const gibs = (layer, tms, ext, bust="") => `${GIBS}/${layer}/default/default/${tms}/{z}/{y}/{x}.${ext}${bust}`;
const LABELS_FIRST = "lbl-border-country"; // every raster is inserted below the vector labels

const BASES = {
  sat:   {name:"Спутник (детально)", sub:"Снимки высокого разрешения, Esri", sw:"linear-gradient(135deg,#1d3a2a,#3c5a34 45%,#1b3150)", tiles:[`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`], max:19, attr:"Снимки © Esri, Maxar, Earthstar Geographics"},
  today: {name:"Земля сегодня", sub:"Снимок всей планеты за сегодня, NASA VIIRS", sw:"linear-gradient(135deg,#f2f5fa,#5d8ab8 50%,#2f5b3a)", tiles:[gibs("VIIRS_SNPP_CorrectedReflectance_TrueColor","GoogleMapsCompatible_Level9","jpg")], max:9, attr:"NASA GIBS / VIIRS"},
  dark:  {name:"Ночная карта", sub:"Тёмная карта с границами", sw:"linear-gradient(135deg,#0c111c,#1e2a3d)", tiles:[`${ESRI}/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`], max:16, attr:"© Esri"}
};
const OVERLAYS = {
  labels: {name:"Названия и границы", sub:"Страны, регионы, города — по-русски", sw:"linear-gradient(135deg,#253247,#536b8f)", def:true},
  temps:  {name:"Температура в городах", sub:"Сейчас, в 90 городах мира", sw:"linear-gradient(90deg,#3f9de8,#8ee6b0,#ffd35c,#ff6a3d)", def:true},
  clouds: {name:"Облака сейчас", sub:"Спутники GOES и Himawari, каждые 10 мин", sw:"linear-gradient(135deg,#e9eef5,#7d93ad 60%,#28344a)", def:false},
  ir:     {name:"Облака (инфракрасный)", sub:"Видно и ночью; высокие облака ярче", sw:"linear-gradient(135deg,#fff,#7c8ea8 50%,#000)", def:false},
  radar:  {name:"Радар осадков", sub:"Дождь и снег за последние 2 часа", sw:"linear-gradient(135deg,#38c172,#ffd35c 50%,#e8455c)", def:false},
  precip: {name:"Осадки со спутника", sub:"Вся планета, NASA IMERG", sw:"linear-gradient(135deg,#2fa8ff,#7b5cff 50%,#ff4fa0)", def:false}
};
let base = store.get("base","sat");
if(!BASES[base]) base = "sat";
const on = Object.assign(Object.fromEntries(Object.entries(OVERLAYS).map(([k,v])=>[k,v.def])), store.get("overlays",{}));

const map = new maplibregl.Map({
  container:"map",
  style:{version:8, projection:{type:"globe"},
    glyphs:"https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
    sources:{}, layers:[{id:"bg",type:"background",paint:{"background-color":"#05070d"}}],
    sky:{"sky-color":"#0a1830","horizon-color":"#3b6aa8","fog-color":"#0d1d38","atmosphere-blend":["interpolate",["linear"],["zoom"],0,1,5,1,7,0]}},
  center: store.get("center",[30,25]), zoom: innerWidth<760 ? 0.9 : 1.6,
  maxPitch: 70, attributionControl:{compact:true}
});

function addRaster(id, src, opts={}){
  if(map.getLayer(id)) map.removeLayer(id);
  if(map.getSource(id)) map.removeSource(id);
  map.addSource(id, src);
  map.addLayer({id, type:"raster", source:id, layout:{visibility:opts.visible?"visible":"none"}, paint:Object.assign({"raster-fade-duration":200}, opts.paint||{})}, map.getLayer(LABELS_FIRST) ? LABELS_FIRST : undefined);
}

/* Russian vector labels and borders (OpenFreeMap / OpenMapTiles) */
function addLabels(){
  map.addSource("omt",{type:"vector",url:"https://tiles.openfreemap.org/planet",attribution:"© OpenStreetMap, OpenFreeMap"});
  const ru = ["coalesce",["get","name:ru"],["get","name"]];
  const halo = {"text-color":"#f4f7fc","text-halo-color":"rgba(5,7,13,.85)","text-halo-width":1.4};
  const L = [
    {id:"lbl-border-country",type:"line","source-layer":"boundary",filter:["all",["==",["get","admin_level"],2],["!=",["get","maritime"],1]],paint:{"line-color":"rgba(255,255,255,.7)","line-width":["interpolate",["linear"],["zoom"],1,.6,6,1.4]}},
    {id:"lbl-border-region",type:"line","source-layer":"boundary",minzoom:4,filter:["all",["==",["get","admin_level"],4],["!=",["get","maritime"],1]],paint:{"line-color":"rgba(255,255,255,.4)","line-width":.8,"line-dasharray":[3,2]}},
    {id:"lbl-ocean",type:"symbol","source-layer":"water_name",filter:["==",["get","class"],"ocean"],layout:{"text-field":ru,"text-font":["Noto Sans Italic"],"text-size":13,"text-letter-spacing":.2,"text-max-width":8},paint:{"text-color":"#9cc8f0","text-halo-color":"rgba(5,7,13,.6)","text-halo-width":1}},
    {id:"lbl-country",type:"symbol","source-layer":"place",maxzoom:7,filter:["==",["get","class"],"country"],layout:{"text-field":ru,"text-font":["Noto Sans Bold"],"text-size":["interpolate",["linear"],["zoom"],1,10,5,15],"text-transform":"uppercase","text-letter-spacing":.08,"text-max-width":7,"symbol-sort-key":["get","rank"]},paint:halo},
    {id:"lbl-state",type:"symbol","source-layer":"place",minzoom:4.5,maxzoom:9,filter:["==",["get","class"],"state"],layout:{"text-field":ru,"text-font":["Noto Sans Italic"],"text-size":12,"text-max-width":8},paint:{"text-color":"#d3dced","text-halo-color":"rgba(5,7,13,.8)","text-halo-width":1.2}},
    {id:"lbl-city",type:"symbol","source-layer":"place",minzoom:3,filter:["==",["get","class"],"city"],layout:{"text-field":ru,"text-font":["Noto Sans Regular"],"text-size":["interpolate",["linear"],["zoom"],3,11,8,15],"symbol-sort-key":["get","rank"],"text-max-width":8,"text-anchor":"top","text-offset":[0,.3]},paint:halo},
    {id:"lbl-town",type:"symbol","source-layer":"place",minzoom:6.5,filter:["==",["get","class"],"town"],layout:{"text-field":ru,"text-font":["Noto Sans Regular"],"text-size":12,"symbol-sort-key":["get","rank"],"text-max-width":8},paint:halo},
    {id:"lbl-village",type:"symbol","source-layer":"place",minzoom:10,filter:["in",["get","class"],["literal",["village","suburb"]]],layout:{"text-field":ru,"text-font":["Noto Sans Regular"],"text-size":11,"text-max-width":8},paint:halo}
  ];

function buildMapLayers(){
  addLabels();
  for(const [k,b] of Object.entries(BASES))
    addRaster("base-"+k,{type:"raster",tiles:b.tiles,tileSize:256,maxzoom:b.max,attribution:b.attr},{visible:k===base});

  applyOverlays();
}

/* geostationary satellites: GOES-East (Americas/Atlantic), GOES-West (Pacific), Himawari (Asia/Oceania) */
let satBust = "";
const SATS = [
  {id:"goes-e", vis:"GOES-East_ABI_GeoColor", visTms:"GoogleMapsCompatible_Level7", ir:"GOES-East_ABI_Band13_Clean_Infrared"},
  {id:"goes-w", vis:"GOES-West_ABI_GeoColor", visTms:"GoogleMapsCompatible_Level7", ir:"GOES-West_ABI_Band13_Clean_Infrared"},
  {id:"hima",   vis:"Himawari_AHI_Band13_Clean_Infrared", visTms:"GoogleMapsCompatible_Level6", ir:"Himawari_AHI_Band13_Clean_Infrared"}
];
function addSatellite(){
  for(const s of SATS) for(const kind of ["vis","ir"]){
    const tms = kind==="vis" ? s.visTms : "GoogleMapsCompatible_Level6";
    addRaster(`${kind}-${s.id}`,{type:"raster",tiles:[gibs(s[kind],tms,"png",satBust)],tileSize:256,maxzoom:tms.endsWith("7")?7:6,attribution:"NASA GIBS, NOAA GOES, JMA Himawari"},{paint:{"raster-opacity": kind==="ir" ? .75 : 1,"raster-fade-duration":300}});
  }
  $("#satStamp").textContent = "Облака обновлены: " + new Date().toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});
}
setInterval(()=>{ if(on.clouds||on.ir){ satBust="?t="+Date.now(); addSatellite(); applyOverlays(); } }, 10*60*1000);

function vis(id, v){ if(map.getLayer(id)) map.setLayoutProperty(id,"visibility",v?"visible":"none"); }
function applyOverlays(){
  for(const k of Object.keys(BASES)) vis("base-"+k, k===base);
  for(const s of SATS){ vis("vis-"+s.id, on.clouds); vis("ir-"+s.id, on.ir && !on.clouds); }
  vis("precip", on.precip);
  (map.__labelIds||[]).forEach(id => vis(id, on.labels));
  if(on.radar) startRadar(); else stopRadar();
  if(on.temps) showTemps(); else hideTemps();
  $("#tempLegend").hidden = !on.temps;
  $("#satStamp").hidden = !(on.clouds||on.ir);
  store.set("base",base); store.set("overlays",on);
}

/* layer panel UI */
function layerBtn(def, pressed, onClick){

/* ================= radar (RainViewer) ================= */
let radar = {frames:[], idx:0, timer:null, loaded:false, loading:null};
function loadRadar(){
  if(radar.loading) return radar.loading;
  radar.loading = (async () => {
    const d = await getJSON("https://api.rainviewer.com/public/weather-maps.json");
    radar.frames = (d.radar.past||[]).concat(d.radar.nowcast||[]);
    radar.frames.forEach((f,i)=> addRaster("radar-"+i,{type:"raster",tiles:[`${d.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`],tileSize:256,maxzoom:7,attribution:"Радар © RainViewer"},{paint:{"raster-opacity":0,"raster-opacity-transition":{duration:0},"raster-fade-duration":0}}));
    radar.loaded = true;
    radar.idx = (d.radar.past||[]).length-1;
    $("#frame").max = radar.frames.length-1;
  })().catch(e => { radar.loading = null; throw e; });
  return radar.loading;
}
async function startRadar(){
  $("#timeline").hidden = false;
  try{ await loadRadar(); showFrame(radar.idx); }
  catch(e){ toast("Не удалось загрузить радар. Проверьте интернет и включите слой ещё раз."); on.radar=false; $("#timeline").hidden=true; renderLayerUI(); }
}
function showFrame(i){
  radar.frames.forEach((f,j)=>{ const id="radar-"+j; if(!map.getLayer(id)) return; map.setLayoutProperty(id,"visibility","visible"); map.setPaintProperty(id,"raster-opacity", j===i ? .8 : 0); });

/* hide labels that collide, sit on the far side of the globe, or cover the selected pin */
function declutter(){
  if(!cityMarkers.length) return;
  const boxes=[], c=map.getCenter(), rad=Math.PI/180;
  if(pin){ const r=pin.getElement().getBoundingClientRect(); boxes.push({left:r.left-6,right:r.right+6,top:r.top-6,bottom:r.bottom+6}); }
  for(const m of cityMarkers){
    const el=m.getElement(), p=m.getLngLat();
    const cosd = Math.sin(c.lat*rad)*Math.sin(p.lat*rad) + Math.cos(c.lat*rad)*Math.cos(p.lat*rad)*Math.cos((p.lng-c.lng)*rad);
    if(cosd < 0.25){ el.style.visibility="hidden"; continue; }
    el.style.visibility="visible";
    const r=el.getBoundingClientRect();
    if(r.width===0) continue;
    if(boxes.some(b=>!(r.right<b.left||r.left>b.right||r.bottom<b.top||r.top>b.bottom))) el.style.visibility="hidden";
    else boxes.push(r);
  }
}
map.on("moveend", declutter);

/* ================= place / weather ================= */
let current = null, pin = null;
async function reverseName(lat, lon){
  try{
    const d = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ru`, 8000, 2);
    const name = d.city || d.locality || d.principalSubdivision || d.countryName;
    const sub = [d.city && d.principalSubdivision !== d.city ? d.principalSubdivision : "", d.countryName].filter(Boolean).join(", ");
    if(!name) return {name: oceanName(lat,lon), sub:""};
    return {name, sub: sub===name ? "" : sub};
  }catch(e){ return {name:"Выбранная точка", sub:""}; }
}
function oceanName(lat,lon){
  if(lat>66) return "Северный Ледовитый океан"; if(lat<-60) return "Южный океан";
  if(lon>20 && lon<120 && lat<25) return "Индийский океан";
  if(lon>-70 && lon<20) return "Атлантический океан";
  return "Тихий океан";
}
const fmtCoord = (lat,lon) => `${Math.abs(lat).toFixed(3)}° ${lat>=0?"с. ш.":"ю. ш."}, ${Math.abs(lon).toFixed(3)}° ${lon>=0?"в. д.":"з. д."}`;
const sheetPadding = () => innerWidth<760 ? {bottom: innerHeight*0.58, top:70, left:0, right:0} : {right:440, left:0, top:0, bottom:0};

function setPin(lat, lon){
  if(pin) pin.remove();
  const p=document.createElement("div"); p.className="pin"; pin=new maplibregl.Marker({element:p}).setLngLat([lon,lat]).addTo(map);
}
async function openPlace(lat, lon, meta={}){
  lon = ((lon+540)%360)-180;
  if(wx.active) closeWx(true);
  stopSpin();
  document.body.classList.add("sheet-open");
  const sheet=$("#sheet"); sheet.hidden=false; sheet.classList.remove("min"); document.body.classList.remove("sheet-min");
  $("#hint").style.opacity=0;
  setPin(lat, lon);
  map.flyTo({center:[lon,lat], zoom:Math.max(map.getZoom(), meta.zoom ?? 4.2), duration:1600, essential:true, padding: sheetPadding()});
  current = {lat, lon, name: meta.name || "…", sub: meta.sub || ""};
  $("#placeName").textContent = current.name; $("#placeSub").textContent = current.sub; $("#placeCoords").textContent = fmtCoord(lat,lon);
  updateStar();
  $("#body").innerHTML = `<div class="loading">Загружаю погоду…</div>`;
  const token = current;
  const namePromise = meta.name ? Promise.resolve({name:meta.name, sub:meta.sub||""}) : reverseName(lat,lon);
  namePromise.then(n => { if(current!==token) return; current.name=n.name; current.sub=n.sub; $("#placeName").textContent=n.name; $("#placeSub").textContent=n.sub; updateStar(); });
  try{
    const [w, aq] = await Promise.all([fetchWeather(lat,lon), fetchAir(lat,lon).catch(()=>null)]);
    if(current!==token) return;
    current.wx = w; current.aq = aq;
    renderWeather();
    sound.update();
  }catch(e){
    if(current!==token) return;
    $("#body").innerHTML = `<div class="err">Не получилось загрузить погоду: сервис не ответил. Проверьте подключение к интернету.<br><button id="retry">Повторить</button></div>`;
    $("#retry").onclick = () => openPlace(lat, lon, {name:current.name, sub:current.sub, zoom:map.getZoom()});
  }
}
function fetchWeather(lat,lon){
  const cur="temperature_2m,relative_humidity_2m,apparent_temperature,dew_point_2m,is_day,precipitation,rain,showers,snowfall,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility,uv_index,snow_depth,cape";
  const hourly="temperature_2m,apparent_temperature,precipitation_probability,precipitation,snowfall,weather_code,wind_speed_10m,wind_gusts_10m,cloud_cover,is_day";
  const daily="weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,daylight_duration,uv_index_max,precipitation_sum,snowfall_sum,precipitation_hours,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant";
  return getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=${cur}&hourly=${hourly}&daily=${daily}&minutely_15=precipitation,snowfall&forecast_minutely_15=32&past_minutely_15=1&timezone=auto&forecast_days=16&wind_speed_unit=ms`);
}
function fetchAir(lat,lon){
  return getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi,pm10,pm2_5,ozone,nitrogen_dioxide,carbon_monoxide,dust,alder_pollen,birch_pollen,grass_pollen,ragweed_pollen&timezone=auto`, 10000, 2);
}

/* ---- short-term precipitation story ("rain ends around 22:00") ---- */
function nowcast(w){
  const m = w.minutely_15, nowIso = w.current.time;
  const kindOf = (p,s) => s>0 && s*0.7 >= p*0.5 ? "snow" : "rain";
  const word = {rain:["Дождь","дождь"], snow:["Снег","снег"]};
  if(!m || !m.time){ return {text:"", bars:[]}; }
  let i0 = m.time.findIndex(t => t > nowIso); i0 = Math.max(0, i0-1);
  const P = m.precipitation.slice(i0), S = (m.snowfall||[]).slice(i0), Tm = m.time.slice(i0);
  const wet = k => (P[k]||0) >= 0.05;
  const bars = P.slice(0,24).map((p,k)=>({p, snow: kindOf(p,S[k]||0)==="snow"}));
  const nowWet = wet(0) || (w.current.precipitation||0) > 0;
  const kind0 = kindOf(Math.max(P[0]||0, w.current.precipitation||0), Math.max(S[0]||0, w.current.snowfall||0));
  let text;
  if(nowWet){
    let end = -1;
    for(let k=1;k<P.length-1;k++) if(!wet(k) && !wet(k+1)){ end=k; break; }
    text = end>0 ? `${word[kind0][0]} закончится около ${Tm[end].slice(11,16)}` : `${word[kind0][0]} продлится ещё несколько часов`;
  } else {
    let start = -1;
    for(let k=1;k<P.length;k++) if(wet(k)){ start=k; break; }
    if(start>0){ const kd = kindOf(P[start], S[start]||0); text = `${start<=2?"Скоро":"Около "+Tm[start].slice(11,16)} начнётся ${word[kd][1]}`; }
    else {
      const h = w.hourly, hi = Math.max(0, h.time.findIndex(t => t >= nowIso.slice(0,13)+":00"));
      let nxt = -1; for(let k=hi;k<hi+24 && k<h.time.length;k++) if((h.precipitation[k]||0)>=0.2){ nxt=k; break; }
      text = nxt<0 ? "Ближайшие сутки без осадков" : `Без осадков примерно до ${h.time[nxt].slice(11,16)}${h.time[nxt].slice(0,10)!==nowIso.slice(0,10)?" завтра":""}`;
    }
  }
  return {text, bars, start: Tm[0]};
}

function renderWeather(){
  const {wx: w, aq} = current, c = w.current, d = w.daily, h = w.hourly;
  const [desc] = WMO[c.weather_code] || ["—"];
  const mmHg = Math.round(c.pressure_msl*0.750062);
  const visS = c.visibility==null ? "—" : c.visibility>=10000 ? ">10 км" : (c.visibility/1000).toFixed(1)+" км";
  const dayLen = d.daylight_duration?.[0] ? `${Math.floor(d.daylight_duration[0]/3600)} ч ${Math.round(d.daylight_duration[0]%3600/60)} мин` : "—";
  const precipNow = (c.precipitation||0) > 0 ? `${c.precipitation} мм` : "нет";
  const snowNow = c.snow_depth ? Math.round(c.snow_depth*100)+" см" : "нет";
  const cape = c.cape==null ? "—" : c.cape<300 ? "низкий" : c.cape<1000 ? "умеренный" : c.cape<2500 ? "высокий" : "очень высокий";
  const nc = nowcast(w);
  const maxBar = Math.max(1, ...nc.bars.map(b=>b.p));
  const barsHtml = nc.bars.map(b => `<i style="height:${b.p<0.02?2:clamp(b.p/maxBar*34,4,34)}px;${b.p>=0.02?`background:${b.snow?"var(--snow)":"var(--rain)"}`:""}"></i>`).join("");

  let html = `

    <div class="desc">${esc(desc)}</div>

  </div>
  ${nc.text ? `<div class="nowcast"><b>${esc(nc.text)}</b>${nc.bars.length?`<div class="ncbars" aria-hidden="true">${barsHtml}</div><div class="ncaxis"><span>сейчас</span><span>+2 ч</span><span>+4 ч</span><span>+6 ч</span></div>`:""}</div>` : ""}
  <div class="quick">
    <button class="qbtn primary" id="qMap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.5A3.5 3.5 0 0 0 7 15z"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/></svg>Погода на карте</button>
    <button class="qbtn" id="qTomorrow">Погода завтра</button>
    <button class="qbtn" id="qCar">Когда мыть машину?</button>
    <button class="qbtn" id="qWear">Как одеться?</button>
  </div>
  <div class="answer" id="answer" hidden></div>
  <div class="section"><h4>Сейчас</h4><div class="grid">
    ${cell("Ветер", `<span class="wind-arrow" style="transform:rotate(${c.wind_direction_10m+180}deg)">↑</span> ${c.wind_speed_10m.toFixed(1)} м/с`, `${dirName(c.wind_direction_10m)}, ${windWord(c.wind_speed_10m)}; порывы до ${c.wind_gusts_10m.toFixed(0)} м/с`)}
    ${cell("Влажность", `${c.relative_humidity_2m}%`, `точка росы ${Tu(c.dew_point_2m)}`)}
    ${cell("Давление", `${mmHg} мм`, `${Math.round(c.pressure_msl)} гПа на уровне моря`)}
    ${cell("Облачность", `${c.cloud_cover}%`, `видимость ${visS}`)}
    ${cell("Осадки сейчас", precipNow, c.snowfall ? `снег ${c.snowfall} см/ч` : `снежный покров: ${snowNow}`)}
    ${cell("УФ-индекс", c.uv_index==null?"—":c.uv_index.toFixed(1), c.uv_index==null?"":uvWord(c.uv_index)+`; макс. сегодня ${d.uv_index_max[0]?.toFixed(1)??"—"}`)}
    ${cell("Восход / закат", `${fmtTime(d.sunrise[0])} / ${fmtTime(d.sunset[0])}`, `световой день ${dayLen}`)}
    ${cell("Риск гроз", cape, `энергия неустойчивости ${Math.round(c.cape??0)} Дж/кг`)}
  </div></div>`;

  const start = Math.max(0, h.time.findIndex(t => t >= c.time.slice(0,13)+":00"));
  html += `<div class="section"><h4>Ближайшие 48 часов <span>температура и осадки</span></h4><div class="hourly">${hourlySVG(h, start, 48)}</div></div>`;

  const lo = Math.min(...d.temperature_2m_min), hi = Math.max(...d.temperature_2m_max);
  html += `<div class="section"><h4>Прогноз на ${d.time.length} дней <span>осадки, мм · вероятность</span></h4><div class="days">`;
  d.time.forEach((t,i)=>{
    const dt = new Date(t+"T12:00:00");
    const name = i===0 ? "Сегодня" : i===1 ? "Завтра" : DOW[dt.getDay()];
    const a = (d.temperature_2m_min[i]-lo)/(hi-lo||1)*100, b = (d.temperature_2m_max[i]-lo)/(hi-lo||1)*100;

      <div class="pr">${pr>0 ? pr.toFixed(1) : "—"}<small>${pp==null?"":pp+"%"}</small></div>
    </div>`;
  });
  html += `</div></div>`;

  if(aq && aq.current){
    const a = aq.current, e = a.european_aqi;
    const [word,col] = e==null ? ["нет данных","#8fa0b8"] : e<=20?["отличное","#5fd39b"]:e<=40?["хорошее","#a8dd6b"]:e<=60?["умеренное","#ffd35c"]:e<=80?["плохое","#ff9d4a"]:e<=100?["очень плохое","#ff6a3d"]:["опасное","#c03a6b"];
    const pollen = [["берёза",a.birch_pollen],["ольха",a.alder_pollen],["злаки",a.grass_pollen],["амброзия",a.ragweed_pollen]].filter(x=>x[1]!=null);
    const n = (v,f=0) => v==null ? "—" : v.toFixed(f);
    html += `<div class="section"><h4>Качество воздуха <span>европейский индекс ${e??"—"}</span></h4>

    </div>`;
  }
  html += `<div class="section" style="color:var(--muted);font-size:12px">Прогноз: модели ECMWF, GFS, ICON и другие через Open-Meteo. Высота точки ${Math.round(w.elevation)} м.</div>`;

function hourlySVG(h, start, n){
  const W = 44, H = 170, top = 34, plotH = 70, barBase = 150;
  const idx = [...Array(n).keys()].map(i=>start+i).filter(i=>i<h.time.length);
  const temps = idx.map(i=>h.temperature_2m[i]);
  const mn = Math.min(...temps), mx = Math.max(...temps), span = (mx-mn)||1;
  const y = t => top + (1-(t-mn)/span)*plotH;
  const width = idx.length*W;
  const maxP = Math.max(2, ...idx.map(i=>h.precipitation[i]||0));
  const pts = idx.map((i,k)=>`${k*W+W/2},${y(h.temperature_2m[i]).toFixed(1)}`).join(" ");
  let s = `<svg width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" role="img" aria-label="Почасовой прогноз температуры и осадков">`;
  s += `<defs><linearGradient id="tl" x1="0" x2="1" y1="0" y2="0">${idx.map((i,k)=>`<stop offset="${(k/(idx.length-1||1)).toFixed(3)}" stop-color="${tColor(h.temperature_2m[i])}"/>`).join("")}</linearGradient></defs>`;
  idx.forEach((i,k)=>{
    const x=k*W, t=h.time[i], hr=t.slice(11,13);
    if(hr==="00"){ const dd=new Date(t); s += `<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="rgba(150,180,220,.25)" stroke-dasharray="3 3"/><text x="${x+4}" y="10" fill="#8fa0b8" font-size="10" font-family="Onest,sans-serif">${dd.getDate()} ${MON[dd.getMonth()]}</text>`; }
    const p = h.precipitation[i]||0, bh = p/maxP*30, snow=(h.snowfall?.[i]||0)>0;
    if(p>0) s += `<rect x="${x+12}" y="${barBase-bh}" width="${W-24}" height="${bh}" rx="2" fill="${snow?"#d9d4ff":"#4aa3ff"}" opacity=".85"/>`;
    const pp = h.precipitation_probability[i];
    s += `<text x="${x+W/2}" y="${barBase+12}" text-anchor="middle" fill="${pp>=50?"#4aa3ff":"#8fa0b8"}" font-size="10" font-family="JetBrains Mono,monospace">${pp==null?"":pp+"%"}</text>`;
    s += `<text x="${x+W/2}" y="${barBase+24}" text-anchor="middle" fill="#8fa0b8" font-size="10" font-family="JetBrains Mono,monospace">${k===0?"сейч":hr+":00"}</text>`;
    s += `<text x="${x+W/2}" y="${y(h.temperature_2m[i])-8}" text-anchor="middle" fill="#e8eef8" font-size="11" font-weight="600" font-family="JetBrains Mono,monospace">${T(h.temperature_2m[i])}°</text>`;
  });
  s += `<polyline points="${pts}" fill="none" stroke="url(#tl)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  idx.forEach((i,k)=>{ s += `<circle cx="${k*W+W/2}" cy="${y(h.temperature_2m[i]).toFixed(1)}" r="2.5" fill="${tColor(h.temperature_2m[i])}"/>`; });
  return s + `</svg>`;
}

/* ================= «Погода на карте»: animated precipitation & cloud forecast ================= */
const N = 17, HOURS = 12, CW = 256, EDGE = 40;
const wx = {active:false, data:null, t:0, timer:null, canvas:null, ctx:null, img:null, center:null, extent:null, clouds:true, precip:true, radar:false, loading:false, offset:0};
/* tileable value noise for cloud/rain texture */
const NOISE = (()=>{
  const S=128, g=new Float32Array(16*16).map(()=>Math.random()), out=new Float32Array(S*S);
  const smooth=t=>t*t*(3-2*t);
  const val=(x,y,f)=>{ const gx=x*f/S, gy=y*f/S, x0=Math.floor(gx), y0=Math.floor(gy), fx=smooth(gx-x0), fy=smooth(gy-y0);
    const G=(i,j)=>g[((j%f+f)%f)*16+((i%f+f)%f)];
    return (G(x0,y0)*(1-fx)+G(x0+1,y0)*fx)*(1-fy)+(G(x0,y0+1)*(1-fx)+G(x0+1,y0+1)*fx)*fy; };
  for(let y=0;y<S;y++) for(let x=0;x<S;x++) out[y*S+x]=val(x,y,4)*.55+val(x,y,8)*.3+val(x,y,16)*.15;
  return {S, out};
})();
const noiseAt = (x,y) => {
  const S=NOISE.S, O=NOISE.out, x0=Math.floor(x), y0=Math.floor(y), fx=x-x0, fy=y-y0;
  const i0=((x0%S)+S)%S, i1=(i0+1)%S, j0=((y0%S)+S)%S, j1=(j0+1)%S;
  return (O[j0*S+i0]*(1-fx)+O[j0*S+i1]*fx)*(1-fy)+(O[j1*S+i0]*(1-fx)+O[j1*S+i1]*fx)*fy;
};
const mercY = lat => Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360));
const invMercY = y => (2*Math.atan(Math.exp(y)) - Math.PI/2)*180/Math.PI;

function wxExtent(lat, lon){
  const dLat = 6, dLon = clamp(dLat/Math.cos(lat*Math.PI/180), 6, 20);
  const n = clamp(lat+dLat, -84, 84), s = clamp(lat-dLat, -84, 84);
  return {n, s, w: lon-dLon, e: lon+dLon};
}
async function loadWxGrid(lat, lon){
  const ext = wxExtent(lat, lon), yN = mercY(ext.n), yS = mercY(ext.s);
  const lats=[], lons=[];
  for(let j=0;j<N;j++){ const la = invMercY(yN + (yS-yN)*j/(N-1)); for(let i=0;i<N;i++){ lats.push(la.toFixed(3)); lons.push((((ext.w + (ext.e-ext.w)*i/(N-1))+540)%360-180).toFixed(3)); } }
  const d = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lats.join(",")}&longitude=${lons.join(",")}&hourly=precipitation,snowfall,cloud_cover,wind_speed_850hPa,wind_direction_850hPa&forecast_hours=${HOURS+2}&timezone=auto&wind_speed_unit=ms`, 25000);
  const arr = Array.isArray(d) ? d : [d];
  const H = arr[0].hourly.time.length, sz = N*N;
  const P = new Float32Array(H*sz), Sn = new Float32Array(H*sz), C = new Float32Array(H*sz);
  let u=0, v=0;
  arr.forEach((r,k)=>{ const h=r.hourly; for(let t=0;t<H;t++){ P[t*sz+k]=h.precipitation[t]||0; Sn[t*sz+k]=h.snowfall[t]||0; C[t*sz+k]=h.cloud_cover[t]||0; }
    const ws=h.wind_speed_850hPa?.[0], wd=h.wind_direction_850hPa?.[0]; if(ws!=null&&wd!=null){ u += -ws*Math.sin(wd*Math.PI/180); v += -ws*Math.cos(wd*Math.PI/180); } });

  const offset = clamp((Date.now()-first)/3600000, 0, 1.5);
  /* texture drift: pixels per hour from mean 850 hPa wind */
  const kmPerPx = (ext.e-ext.w)*111*Math.cos(lat*Math.PI/180)/CW;
  return {ext, P, Sn, C, H, u, v, offset, tz, first, drift:{x: u*3.6/kmPerPx, y: -v*3.6/kmPerPx}};
}

function sampleField(F, H, t, gx, gy){
  const t0 = Math.floor(t), t1 = Math.min(H-1, t0+1), ft = t - t0;
  const x0 = Math.floor(gx), y0 = Math.floor(gy), x1 = Math.min(N-1,x0+1), y1 = Math.min(N-1,y0+1), fx = gx-x0, fy = gy-y0, sz=N*N;
  const at = (tt) => { const o=tt*sz; return (F[o+y0*N+x0]*(1-fx)+F[o+y0*N+x1]*fx)*(1-fy)+(F[o+y1*N+x0]*(1-fx)+F[o+y1*N+x1]*fx)*fy; };
  return at(t0)*(1-ft) + at(t1)*ft;
}
const RAIN = [[0.05,[150,210,255,.55]],[0.4,[90,170,255,.7]],[1.5,[61,155,255,.72]],[4,[31,79,208,.8]],[8,[138,63,224,.85]],[16,[224,48,106,.9]]];
function rainColor(p){
  if(p<RAIN[0][0]) return null;
  for(let i=1;i<RAIN.length;i++) if(p<=RAIN[i][0]){ const [a,ca]=RAIN[i-1],[b,cb]=RAIN[i], f=(p-a)/(b-a); return ca.map((v,k)=>v+(cb[k]-v)*f); }
  return RAIN[RAIN.length-1][1];
}
function drawWx(){
  const D = wx.data; if(!D) return;
  const ctx = wx.ctx, img = wx.img, px = img.data, t = clamp(wx.t + D.offset, 0, D.H-1.001);
  const dx = D.drift.x*t, dy = D.drift.y*t, step = (N-1)/(CW-1);
  for(let y=0;y<CW;y++){
    const gy = y*step;
    for(let x=0;x<CW;x++){
      const gx = x*step, o = (y*CW+x)*4;
      let r=0,g=0,b=0,a=0;
      const n1 = noiseAt(x*1.35 - dx*1.5, y*1.35 - dy*1.5), n2 = noiseAt(x*3.1 - dx*1.9 + 40, y*3.1 - dy*1.9 + 70);
      if(wx.clouds){
        const c = sampleField(D.C, D.H, t, gx, gy)/100;
        const ca = clamp(c*1.05 - .15 + (n1-.5)*.55, 0, 1) * .5;
        if(ca>0){ r=g=b=242; a=ca; }
      }
      if(wx.precip){
        let p = sampleField(D.P, D.H, t, gx, gy);
        if(p>0.02){
          p *= .55 + n1*.7 + (n2-.5)*.35;
          const s = sampleField(D.Sn, D.H, t, gx, gy);
          if(s>0 && s*0.7 >= p*0.45){
            if(p>=0.05){ const k=clamp(p/3,0,1); const sa=.5+.35*k; r=r*(1-sa)+(244-30*k)*sa; g=g*(1-sa)+(242-50*k)*sa; b=b*(1-sa)+255*sa; a=Math.max(a,sa); }
          } else {
            const col = rainColor(p);
            if(col){ const pa=col[3]; r=r*(1-pa)+col[0]*pa; g=g*(1-pa)+col[1]*pa; b=b*(1-pa)+col[2]*pa; a=Math.max(a,pa); }
          }
        }
      }
      const ed = Math.min(x, y, CW-1-x, CW-1-y); if(ed < EDGE){ const f = ed/EDGE; a *= f*f*(3-2*f); }
      px[o]=r; px[o+1]=g; px[o+2]=b; px[o+3]=a*255;
    }
  }
  ctx.putImageData(img,0,0);
  const src = map.getSource("wxcanvas");
  if(src && !wx.pending){ wx.pending = true; src.updateImage({url: wx.canvas.toDataURL("image/png"), coordinates: wx.coords}); setTimeout(()=>{ wx.pending=false; }, 60); }
  updateWxClock();
}
function updateWxClock(){
  const D = wx.data; if(!D) return;
  const ms = Date.now() + wx.t*3600000, dt = new Date(ms + D.tz*1000);
  const hh = String(dt.getUTCHours()).padStart(2,"0"), mm = String(Math.floor(dt.getUTCMinutes()/15)*15).padStart(2,"0");
  $("#wxClock").textContent = wx.t < 0.13 ? "сейчас" : `${hh}:${mm}`;
  $("#wxRange").value = wx.t;
  $("#wxRange").setAttribute("aria-valuetext", wx.t < 0.13 ? "сейчас" : `${hh}:${mm}`);
}
function wxTicks(D){
  const out=[]; for(let k=0;k<=HOURS;k+=3){ const dt=new Date(Date.now()+k*3600000+D.tz*1000); out.push(k===0?"сейчас":String(dt.getUTCHours()).padStart(2,"0")+":00"); }
  $("#wxTicks").innerHTML = out.map(s=>`<span>${s}</span>`).join("");
}
function setWxCanvas(ext){
  const coords = [[ext.w,ext.n],[ext.e,ext.n],[ext.e,ext.s],[ext.w,ext.s]];
  if(map.getLayer("wxcanvas")) map.removeLayer("wxcanvas");
  if(map.getSource("wxcanvas")) map.removeSource("wxcanvas");
  map.addSource("wxcanvas",{type:"image",url:wx.canvas.toDataURL("image/png"),coordinates:coords});
  wx.coords = coords;
  map.addLayer({id:"wxcanvas",type:"raster",source:"wxcanvas",paint:{"raster-opacity":.95,"raster-fade-duration":0,"raster-resampling":"linear"}}, map.getLayer(LABELS_FIRST)?LABELS_FIRST:undefined);
}
async function openWx(){
  if(wx.loading) return;
  const lat = current ? current.lat : map.getCenter().lat, lon = current ? current.lon : map.getCenter().lng;
  wx.active = true; wx.center = {lat, lon};

async function loadWxFor(lat, lon){
  wx.loading = true; $("#wxRefresh").hidden = true;
  const prevText = $("#wxText").textContent;
  $("#wxText").textContent = "Загружаю карту осадков…";
  try{
    const D = await loadWxGrid(lat, lon);
    if(!wx.active) return;
    wx.data = D; wx.extent = D.ext; wx.center = {lat, lon}; wx.t = 0;
    if(!wx.canvas){ wx.canvas = document.createElement("canvas"); wx.canvas.width = wx.canvas.height = CW; wx.ctx = wx.canvas.getContext("2d"); wx.img = wx.ctx.createImageData(CW, CW); }
    wxTicks(D);
    drawWx();
    setWxCanvas(D.ext);
    $("#wxText").textContent = prevText==="Загружаю карту осадков…" ? "Осадки и облака на 12 часов вперёд" : prevText;
    if(current?.wx && Math.abs(current.lat-lat)<0.5 && Math.abs(current.lon-lon)<0.5){
      const nc = nowcast(current.wx).text, area = areaNearby(D);
      $("#wxText").textContent = [nc, /без осадков/i.test(nc) ? area : ""].filter(Boolean).join(". ") || "Осадки и облака на 12 часов вперёд";
    } else $("#wxText").textContent = summarizeArea(D);
    if(wx.radar) showWxRadar(true);
    wxPlay(true);
  }catch(e){
    $("#wxText").textContent = "Не удалось загрузить карту осадков. Проверьте интернет и нажмите «Показать осадки для этой области».";

  }finally{ wx.loading = false; }
}
function areaNearby(D){
  const sz=N*N, hrs=Math.min(D.H, HOURS); let any=false, snow=false;
  for(let t=0;t<hrs;t++) for(let k=0;k<sz;k++) if(D.P[t*sz+k]>=0.1){ any=true; if(D.Sn[t*sz+k]>0) snow=true; }
  return any ? (snow ? "Рядом пройдёт снег, смотрите на карте" : "Рядом пройдут дожди, смотрите на карте") : "";
}
function summarizeArea(D){
  const sz=N*N, ci=Math.floor(N/2)*N+Math.floor(N/2), hrs=Math.min(D.H, HOURS);
  let wet=0, any=false, snow=false;
  for(let t=0;t<hrs;t++){ for(let k=0;k<sz;k++) if(D.P[t*sz+k]>=0.1){ any=true; if(D.Sn[t*sz+k]>0) snow=true; } }
  for(let t=0;t<hrs;t++) if(D.P[t*sz+ci]>=0.1) wet++;

  return wet ? `В центре карты осадки около ${wet} ч из ближайших 12` : `Рядом ${snow?"идёт снег":"идут дожди"}, в центре карты сухо`;
}
function wxPlay(force){

  clearInterval(wx.timer);

  $("#wxPlay").innerHTML=PAUSE_ICON; $("#wxPlay").setAttribute("aria-label","Пауза");

}
function closeWx(keepSheet){

  $("#wxPlay").innerHTML=PLAY_ICON;
  if(map.getLayer("wxcanvas")) map.removeLayer("wxcanvas");

}
async function showWxRadar(v){

}
$("#wxBtn").onclick = () => wx.active ? closeWx(false) : openWx();
$("#wxClose").onclick = () => closeWx(false);
$("#wxPlay").onclick = () => wxPlay(false);

$("#tgClouds").onclick = e => { wx.clouds = !wx.clouds; e.currentTarget.setAttribute("aria-pressed", wx.clouds); drawWx(); };

$("#tgRadar").onclick = e => { wx.radar = !wx.radar; e.currentTarget.setAttribute("aria-pressed", wx.radar); showWxRadar(wx.radar); if(wx.radar) toast("Радар показывает, где осадки идут прямо сейчас. Покрытие есть не во всех странах."); };
map.on("moveend", () => {
  if(!wx.active || !wx.extent || wx.loading) return;
  const c = map.getCenter(), e = wx.extent, hw = (e.e-e.w)/2, hh = (e.n-e.s)/2;
  const off = Math.abs(((c.lng - (e.w+e.e)/2)+540)%360-180) > hw*.55 || Math.abs(c.lat - (e.n+e.s)/2) > hh*.55 || map.getZoom() < 4.3;

/* ================= ambient weather sound (synthesised, no files) ================= */
const sound = {
  ctx:null, on:false, nodes:null, thunderT:null, dropT:null,
  noise(type){
    const len = this.ctx.sampleRate*3, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
    let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; if(type==="brown"){ last=(last+0.02*w)/1.02; d[i]=last*3.5; } else d[i]=w; }
    const s = this.ctx.createBufferSource(); s.buffer=buf; s.loop=true; return s;
  },
  build(){
    const c = this.ctx, master = c.createGain(); master.gain.value = 0; master.connect(c.destination);
    const rainSrc = this.noise("white"), rainF = c.createBiquadFilter(); rainF.type="bandpass"; rainF.frequency.value=2200; rainF.Q.value=.6;
    const rainLP = c.createBiquadFilter(); rainLP.type="lowpass"; rainLP.frequency.value=6000;
    const rainG = c.createGain(); rainG.gain.value=0; rainSrc.connect(rainF).connect(rainLP).connect(rainG).connect(master);
    const windSrc = this.noise("brown"), windF = c.createBiquadFilter(); windF.type="lowpass"; windF.frequency.value=500; windF.Q.value=3;
    const windG = c.createGain(); windG.gain.value=0; windSrc.connect(windF).connect(windG).connect(master);
    const lfo = c.createOscillator(), lfoG = c.createGain(); lfo.frequency.value=.13; lfoG.gain.value=260; lfo.connect(lfoG).connect(windF.frequency);
    const lfo2 = c.createOscillator(), lfo2G = c.createGain(); lfo2.frequency.value=.07; lfo2G.gain.value=.25; lfo2.connect(lfo2G).connect(windG.gain);
    rainSrc.start(); windSrc.start(); lfo.start(); lfo2.start();
    this.nodes = {master, rainG, rainF, windG, windF, lfo2G};
  },
  params(){
    const w = current?.wx?.current;
    if(!w) return {rain:0, wind:.25, storm:false, snow:false};
    const k = (WMO[w.weather_code]||["","cloud"])[1];
    const p = Math.max(w.precipitation||0, (k==="rain"||k==="storm") ? 0.8 : k==="drizzle" ? 0.3 : 0);
    const snow = k==="snow" || (w.snowfall||0)>0;
    return {rain: snow ? 0 : clamp(p/4, 0, 1), wind: clamp(w.wind_speed_10m/14, .12, 1), storm: k==="storm", snow};
  },
  update(){
    if(!this.on || !this.ctx) return;
    const {rain, wind, storm, snow} = this.params(), n = this.nodes, t = this.ctx.currentTime;
    n.rainG.gain.setTargetAtTime(rain>0 ? .08 + rain*.32 : 0, t, 1.2);
    n.rainF.frequency.setTargetAtTime(1600 + rain*1400, t, 1);
    n.windG.gain.setTargetAtTime((snow ? .5 : .35) * wind + .05, t, 1.5);
    n.windF.frequency.setTargetAtTime(snow ? 300 : 350 + wind*500, t, 1.5);
    n.lfo2G.gain.setTargetAtTime(.12 + wind*.25, t, 1.5);
    clearTimeout(this.dropT); if(rain>0) this.drops(rain);
    clearTimeout(this.thunderT); if(storm) this.thunderLoop();
  },
  drops(rain){
    const go = () => {
      if(!this.on) return;
      const c=this.ctx, s=c.createBufferSource(), len=Math.floor(c.sampleRate*.03), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(len*.12));
      s.buffer=b; const f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=2500+Math.random()*3000;
      const g=c.createGain(); g.gain.value=.05+Math.random()*.12; const pn = c.createStereoPanner ? c.createStereoPanner() : null;
      if(pn){ pn.pan.value=Math.random()*2-1; s.connect(f).connect(g).connect(pn).connect(this.nodes.master); } else s.connect(f).connect(g).connect(this.nodes.master);
      s.start(); this.dropT = setTimeout(go, 20 + Math.random()*(220 - rain*180));
    };
    go();
  },
  thunderLoop(){
    const boom = () => {
      if(!this.on) return;
      const c=this.ctx, s=this.noise("brown"), f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=180;
      const g=c.createGain(), t=c.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.9,t+.15+Math.random()*.4); g.gain.exponentialRampToValueAtTime(.001,t+4+Math.random()*3);
      s.connect(f).connect(g).connect(this.nodes.master); s.start(); s.stop(t+8);
      this.thunderT = setTimeout(boom, 9000 + Math.random()*22000);
    };
    this.thunderT = setTimeout(boom, 2500);
  },
  async toggle(){
    try{
      if(!this.ctx){ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); this.build(); }
      this.on = !this.on;
      if(this.on){ await this.ctx.resume(); this.nodes.master.gain.setTargetAtTime(.9, this.ctx.currentTime, .6); this.update();
        toast(current ? `Звуки погоды: ${current.name}` : "Звуки погоды. Выберите место, и звук подстроится под его погоду."); }
      else { this.nodes.master.gain.setTargetAtTime(0, this.ctx.currentTime, .3); clearTimeout(this.dropT); clearTimeout(this.thunderT); setTimeout(()=>{ if(!this.on) this.ctx.suspend(); }, 1200); }
      $("#sound").setAttribute("aria-pressed", this.on); $("#soundWaves").setAttribute("opacity", this.on ? "1" : ".35");
      store.set("sound", this.on);
    }catch(e){ this.on=false; toast("Браузер не дал включить звук."); }
  }
};
$("#sound").onclick = () => sound.toggle();
document.addEventListener("visibilitychange", () => { if(!sound.ctx || !sound.on) return; document.hidden ? sound.ctx.suspend() : sound.ctx.resume(); });

/* ================= favourites ================= */
let favs = store.get("favs", []);
function renderFavs(){
  const box=$("#favs"); box.innerHTML="";
  favs.slice(0,8).forEach(f=>{
    const b=document.createElement("button"); b.className="chip glass"; b.textContent=f.name;
    b.onclick=()=>openPlace(f.lat,f.lon,{name:f.name,sub:f.sub,zoom:6}); box.appendChild(b);
  });
}
const keyOf = p => p.lat.toFixed(2)+","+p.lon.toFixed(2);
function updateStar(){ const s = !!current && favs.some(f=>keyOf(f)===keyOf(current)); $("#star").setAttribute("aria-pressed", s); $("#star").setAttribute("aria-label", s?"Убрать из избранного":"Добавить в избранное"); }
$("#star").onclick = () => {
  if(!current) return;
  const k = keyOf(current);
  if(favs.some(f=>keyOf(f)===k)){ favs = favs.filter(f=>keyOf(f)!==k); toast("Убрано из избранного"); }
  else { favs.unshift({lat:current.lat, lon:current.lon, name:current.name, sub:current.sub}); toast("Добавлено в избранное"); }
  store.set("favs",favs); renderFavs(); updateStar();
};

/* ================= search ================= */
let sTimer=null, sIdx=-1, sItems=[], sSeq=0;
$("#q").addEventListener("input", e => {
  clearTimeout(sTimer); const q=e.target.value.trim();
  if(q.length<2){ hideResults(); return; }
  sTimer=setTimeout(()=>search(q), 280);
});
async function search(q){
  const seq = ++sSeq;
  try{
    const d = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=ru&format=json`, 10000);
    if(seq !== sSeq) return;
    sItems = d.results || [];
    const r=$("#results"); r.innerHTML="";
    if(!sItems.length){ r.innerHTML=`<button disabled>Ничего не найдено<small>Попробуйте другое написание</small></button>`; }
    sItems.forEach((it,i)=>{
      const b=document.createElement("button"); b.setAttribute("role","option");
      b.innerHTML = `${esc(it.name)}<small>${esc([it.admin1, it.country].filter(Boolean).join(", "))}${it.population?` · ${(it.population>=1e6?(it.population/1e6).toFixed(1)+" млн":Math.round(it.population/1000)+" тыс.")} жителей`:""}</small>`;
      b.onclick=()=>pick(i); r.appendChild(b);
    });
    r.hidden=false; $("#q").setAttribute("aria-expanded","true"); sIdx=-1;
  }catch(e){ if(seq===sSeq) toast("Поиск не ответил. Попробуйте ещё раз."); }
}
function pick(i){
  const it=sItems[i]; if(!it) return;
  hideResults(); $("#q").value=it.name; $("#q").blur();
  const z = it.feature_code?.startsWith("PCL") ? 3.5 : it.feature_code==="ADM1" ? 5 : 8;
  openPlace(it.latitude, it.longitude, {name:it.name, sub:[it.admin1, it.country].filter(Boolean).join(", "), zoom:z});
}
function hideResults(){ $("#results").hidden=true; $("#q").setAttribute("aria-expanded","false"); }
$("#q").addEventListener("keydown", e => {
  const btns=[...$("#results").querySelectorAll("button:not([disabled])")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!btns.length) return; sIdx=(sIdx+(e.key==="ArrowDown"?1:-1)+btns.length)%btns.length; btns.forEach((b,i)=>b.classList.toggle("active",i===sIdx)); }
  if(e.key==="Enter"){ e.preventDefault(); if(sItems.length) pick(sIdx<0?0:sIdx); }
  if(e.key==="Escape") hideResults();
});
document.addEventListener("click", e => { if(!e.target.closest(".search")) hideResults(); });

/* ================= geolocation ================= */
$("#locate").onclick = () => {
  if(!navigator.geolocation){ toast("Браузер не умеет определять местоположение."); return; }
  toast("Определяю местоположение…");
  navigator.geolocation.getCurrentPosition(
    p => openPlace(p.coords.latitude, p.coords.longitude, {zoom:8}),
    () => toast("Нет доступа к местоположению. Разрешите его в настройках браузера или найдите город через поиск."),
    {enableHighAccuracy:true, timeout:10000});
};

/* ================= globe controls ================= */
let spinning = store.get("spin", true), userBusy=false;
function spinStep(){
  if(!spinning || userBusy || map.getZoom()>3 || wx.active) return;
  const c = map.getCenter(); c.lng -= 6;
  map.easeTo({center:c, duration:1000, easing:n=>n});
}
map.on("moveend", () => { if(spinning && !userBusy) spinStep(); });
map.on("mousedown", ()=>{userBusy=true}); map.on("touchstart", ()=>{userBusy=true});
map.on("mouseup", ()=>{userBusy=false}); map.on("touchend", ()=>{userBusy=false});
function stopSpin(){ spinning=false; $("#spin").setAttribute("aria-pressed","false"); store.set("spin",false); }
$("#spin").setAttribute("aria-pressed", spinning);
$("#spin").onclick = () => { spinning=!spinning; $("#spin").setAttribute("aria-pressed",spinning); store.set("spin",spinning); if(spinning) spinStep(); };
$("#home").onclick = () => { if(wx.active) closeWx(true); map.flyTo({zoom: innerWidth<760?0.9:1.6, pitch:0, bearing:0, duration:1500, padding:{top:0,bottom:0,left:0,right:0}}); };
$("#units").textContent = "°"+units;
$("#units").onclick = () => { units = units==="C"?"F":"C"; store.set("units",units); $("#units").textContent="°"+units; if(current?.wx) renderWeather(); if(on.temps) showTemps(); };

$("#close").onclick = () => { $("#sheet").hidden=true; document.body.classList.remove("sheet-open","sheet-min"); if(pin){pin.remove();pin=null;} current=null; sound.update(); map.easeTo({padding:{top:0,bottom:0,left:0,right:0}, duration:500}); };
$("#grab").onclick = () => { const s=$("#sheet"); s.classList.toggle("min"); document.body.classList.toggle("sheet-min", s.classList.contains("min")); };

map.on("click", e => { if(wx.active) return; openPlace(e.lngLat.lat, e.lngLat.lng); });
map.on("moveend", () => { const c=map.getCenter(); store.set("center",[+c.lng.toFixed(2), +c.lat.toFixed(2)]); });
addEventListener("keydown", e => { if(e.key==="Escape"){ if(wx.active) closeWx(false); else if(!$("#sheet").hidden) $("#close").click(); } });

map.on("load", () => {
  buildMapLayers(); renderLayerUI(); renderFavs();
  if(spinning) setTimeout(spinStep, 800);
  setTimeout(()=>{ $("#hint").style.opacity=0; }, 9000);
});
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
map.on("error", () => { /* tile errors are expected at satellite disc edges; ignore */ });
</script>
