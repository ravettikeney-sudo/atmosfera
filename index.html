<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Атмосфера — погода на 3D-глобусе</title>
<meta name="description" content="Точная погода в любой точке планеты на интерактивном 3D-глобусе: прогноз на 16 дней, карта осадков, радар, живые спутниковые снимки облаков и звуки погоды.">
<meta name="theme-color" content="#14234a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%230b1c33' stroke='%237cc4ff' stroke-width='4'/%3E%3Cpath d='M10 36c8-6 16 6 24 0s14-8 20-2' fill='none' stroke='%23ffb35c' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
/* Layout: full-bleed globe in space; search top-left, layer dock bottom-left, tool column bottom-right,
   weather sheet right (desktop) / bottom sheet (phone); "weather map" mode swaps the sheet for a timeline panel. */
:root{
  --space:#14234a; --space2:#0a1330; --panel:rgba(20,32,66,.84); --panel-solid:#17264d; --raise:rgba(255,255,255,.06); --line:rgba(170,200,240,.18);
  --fg:#e8eef8; --muted:#8fa0b8; --ice:#7cc4ff; --sun:#ffb35c; --rain:#4aa3ff; --snow:#d9d4ff; --warn:#ff7a59;
  --display:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --space:#dfeaf7; --space2:#b9cde8; --panel:rgba(255,255,255,.92); --panel-solid:#ffffff; --raise:rgba(20,45,90,.045); --line:rgba(20,45,90,.14);
  --fg:#0f1a2b; --muted:#56667d; --ice:#1d78d0; --sun:#c9741a; --rain:#1f78e0; --snow:#6f62d6; --warn:#d4552f;
  color-scheme:light;
}
:root[data-theme="light"] .qbtn.primary, :root[data-theme="light"] .play{color:#fff}
:root[data-theme="light"] .alert.l1{background:#fff6dc;border-color:#f0cf6a;color:#6d5000}
:root[data-theme="light"] .alert.l2{background:#ffe9e2;border-color:#f2a58f;color:#8a2c12}
:root[data-theme="light"] .alert.l3{background:#ffe1ea;border-color:#ee8fab;color:#8c1239}
:root[data-theme="light"] .ncbars i{background:rgba(20,45,90,.12)}
:root[data-theme="light"] .layer[aria-pressed="true"] .chk::after{border-color:#fff}
:root[data-theme="light"] .maplibregl-ctrl-attrib{background:rgba(255,255,255,.7)!important}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 35%, var(--space) 0%, var(--space2) 70%) fixed, var(--space2);color:var(--fg);font:15px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{background:rgba(5,7,13,.6)!important;color:var(--muted)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-bottom-right{margin-bottom:env(safe-area-inset-bottom,0px)}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}

/* ---- top bar ---- */
.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));z-index:5;display:flex;gap:8px;align-items:flex-start;width:min(540px,calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)))}
.brand{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:14px;font:700 13px var(--display);letter-spacing:.04em;white-space:nowrap}
.brand svg{flex:none}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:46px;padding:0 44px 0 16px;border-radius:14px;outline:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--ice)}
.icon-btn{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;flex:none;padding:0}
.icon-btn:hover{border-color:var(--ice)}
.icon-btn[aria-pressed="true"]{border-color:var(--ice);color:var(--ice);background:rgba(124,196,255,.16)}
.search .locate{position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;background:transparent;display:grid;place-items:center;border-radius:10px}
.search .locate:hover{background:rgba(124,196,255,.12)}
.results{position:absolute;top:52px;left:0;right:0;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.results button{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:10px 14px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.active{background:rgba(124,196,255,.1)}
.results small{color:var(--muted)}
.favs{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--ice)}

/* ---- layer dock ---- */
.dock{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.layers{border-radius:16px;padding:10px;width:min(300px,calc(100vw - 24px));max-height:min(62vh,540px);overflow:auto}
.layers h3{margin:4px 6px 8px;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.layer{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:10px;background:none;text-align:left}
.layer:hover{background:rgba(124,196,255,.08)}
.layer .sw{width:34px;height:34px;border-radius:9px;flex:none;border:1px solid var(--line)}
.layer b{display:block;font-weight:600;font-size:14px}
.layer small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.layer[aria-pressed="true"]{background:rgba(124,196,255,.14)}
.layer[aria-pressed="true"] .sw{border-color:var(--ice);box-shadow:0 0 0 2px rgba(124,196,255,.35)}
.layer .chk{margin-left:auto;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.layer[aria-pressed="true"] .chk{background:var(--ice);border-color:var(--ice)}
.layer[aria-pressed="true"] .chk::after{content:"";width:8px;height:5px;border:2px solid #0d1830;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.sep{height:1px;background:var(--line);margin:8px 4px}
.stamp{font:12px var(--mono);color:var(--muted);padding:2px 8px 4px}
.timeline{display:flex;align-items:center;gap:10px;border-radius:14px;padding:8px 12px;width:min(340px,calc(100vw - 24px))}
.timeline input{flex:1;accent-color:var(--rain);min-width:0}
.timeline span{font:600 13px var(--mono);min-width:56px;text-align:right}
.play{width:36px;height:36px;border-radius:50%;border:0;background:var(--rain);color:#0d1830;display:grid;place-items:center;flex:none;padding:0}
.legend{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--muted);padding:0 8px 6px}
.legend i{flex:1;height:6px;border-radius:3px}

/* ---- tool column ---- */
.toolbar{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;gap:8px}
body.sheet-open .toolbar{right:calc(444px + env(safe-area-inset-right,0px))}
.toolbar .icon-btn{width:44px;height:44px;border-radius:13px}
.unit-toggle{font:600 13px var(--mono)}

/* ---- weather sheet ---- */
.sheet{position:fixed;z-index:6;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:420px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{padding:18px 18px 12px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
.grab{display:none}
.place{flex:1;min-width:0}
.place h2{margin:0;font:700 19px/1.2 var(--display);text-wrap:balance;overflow-wrap:anywhere}
.place p{margin:4px 0 0;color:var(--muted);font-size:13px}
.coords{font:12px var(--mono);color:var(--muted)}
.head-actions{display:flex;gap:6px}
.head-actions .icon-btn{width:38px;height:38px;border-radius:11px}
.star[aria-pressed="true"] svg{fill:var(--sun);stroke:var(--sun)}
.sheet-body{overflow:auto;padding:0 18px 18px;flex:1;overscroll-behavior:contain}
.now{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;padding:18px 0 10px}
.now .big{font:300 72px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.now .wx-ico{width:64px;height:64px}
.now .desc{grid-column:1/-1;font-size:16px;font-weight:600}
.now .feel{grid-column:1/-1;color:var(--muted);font-size:14px}
.localtime{font:13px var(--mono);color:var(--muted)}
.nowcast{margin:6px 0 4px;padding:12px 14px;border-radius:14px;background:var(--raise);border:1px solid var(--line)}
.nowcast b{display:block;font:600 16px/1.3 var(--body);text-wrap:balance}
.ncbars{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:10px}
.ncbars i{flex:1;border-radius:2px 2px 0 0;min-height:2px;background:rgba(150,180,220,.18)}
.ncaxis{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);margin-top:4px}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 4px}
.qbtn{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:14px;font-weight:500}
.qbtn:hover{border-color:var(--ice)}
.qbtn.primary{background:var(--ice);border-color:var(--ice);color:#0d1830;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.answer{margin-top:8px;padding:12px 14px;border-radius:14px;background:rgba(124,196,255,.08);border:1px solid rgba(124,196,255,.25);font-size:14px}
.answer b{display:block;margin-bottom:2px}
.section{padding:14px 0;border-top:1px solid var(--line);margin-top:10px}
.section h4{margin:0 0 10px;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section h4 span{text-transform:none;letter-spacing:0;font:12px var(--mono)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.cell small{display:block;color:var(--muted);font-size:12px}
.cell b{display:block;font:600 18px var(--mono);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell em{display:block;font-style:normal;color:var(--muted);font-size:12px}
.wind-arrow{display:inline-block}
.hourly{overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:thin}
.hourly svg{display:block}
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:62px 28px minmax(0,1fr) 52px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.day:last-child{border-bottom:0}
.day.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:rgba(124,196,255,.18)}100%{background:transparent}}
.day .dname{font-weight:600;font-size:14px}
.day .dname small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.day .range{display:flex;align-items:center;gap:8px;font:13px var(--mono)}
.day .range .lo{color:var(--muted);width:32px;text-align:right}
.day .range .hi{width:32px}
.bar{position:relative;flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.07)}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.day .pr{font:12px var(--mono);color:var(--rain);text-align:right}
.day .pr small{display:block;color:var(--muted)}
.aqi{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.aqi .dot{width:14px;height:14px;border-radius:50%}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.err{padding:14px;border-radius:12px;background:rgba(255,122,89,.1);border:1px solid rgba(255,122,89,.35);color:#ffc2b1;margin-top:14px}
.err button{margin-top:8px;padding:6px 12px;border-radius:8px;border:1px solid currentColor;background:none}

/* ---- weather map mode ---- */
.wxpanel{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));border-radius:20px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px}
.wx-head{display:flex;align-items:flex-start;gap:12px}
.wx-head .t{flex:1;min-width:0}
.wx-head h3{margin:0;font:700 16px/1.25 var(--display);overflow-wrap:anywhere}
.wx-head p{margin:4px 0 0;font-size:14px;font-weight:600;text-wrap:balance}
.wx-head .icon-btn{width:38px;height:38px;border-radius:11px}
.wx-time{display:flex;align-items:center;gap:12px}
.wx-time input{flex:1;accent-color:var(--ice);min-width:0}
.wx-clock{font:600 15px var(--mono);min-width:76px;text-align:right;white-space:nowrap}
.wx-ticks{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);padding:0 2px 0 50px;margin-top:-6px}
.wx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.wx-legend span{display:inline-flex;align-items:center;gap:6px}
.wx-legend i{display:inline-block;width:26px;height:8px;border-radius:4px}
.wx-toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:13px}
.tg[aria-pressed="true"]{background:rgba(124,196,255,.18);border-color:var(--ice);color:var(--fg)}
.tg[aria-pressed="false"]{color:var(--muted)}
.refresh{align-self:center;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--ice);background:rgba(124,196,255,.15)}
.wx-status{font-size:13px;color:var(--muted)}
body.wxmode .dock{display:none}
body.wxmode .toolbar{bottom:calc(30px + env(safe-area-inset-bottom,0px) + var(--wxh,220px))}

.temp-marker{font:600 12px var(--mono);padding:3px 7px;border-radius:999px;color:#0d1830;box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer;white-space:nowrap;border:1px solid rgba(0,0,0,.25)}
.pin{width:22px;height:22px;border-radius:50%;background:var(--sun);border:3px solid #fff;box-shadow:0 0 0 6px rgba(255,179,92,.3),0 4px 10px rgba(0,0,0,.5)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom,0px));z-index:3;border-radius:999px;padding:8px 16px;font-size:13px;color:var(--muted);pointer-events:none;transition:opacity .4s;white-space:nowrap;max-width:calc(100vw - 140px);overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);width:max-content;max-width:calc(100vw - 32px)}

/* temperature text tinted by its value: --t comes from the temperature scale */
.tc{color:var(--t,var(--fg));fill:var(--t,var(--fg))}
:root[data-theme="light"] .tc{color:color-mix(in srgb, var(--t) 52%, #0c1630);fill:color-mix(in srgb, var(--t) 52%, #0c1630)}
/* every pressable thing lights up when pressed */
button,[role=button],.layer,.crow .open,.chip,.qbtn,.tg,.tabs button,.segm button,.peek,.mc{transition:background-color .15s,box-shadow .15s,transform .12s,border-color .15s}
button:active,[role=button]:active,.tap{transform:scale(.96)}
.tap,button:active,[role=button]:active{box-shadow:0 0 0 3px rgba(124,196,255,.45),0 0 18px rgba(124,196,255,.35)!important;background-color:rgba(124,196,255,.24)!important;border-color:var(--ice)!important}
.qbtn.primary.tap,.qbtn.primary:active,.play.tap,.play:active{background-color:#a9dbff!important}
.peek.tap,.peek:active,.mc.tap{transform:scale(.985)}
@media (hover:hover){.qbtn:hover,.tg:hover,.chip:hover,.tabs button:hover,.segm button:hover{border-color:var(--ice);background-color:rgba(124,196,255,.12)}}
/* text never spills out of buttons */
button{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis}
.qbtn,.tg,.chip,.addcur{white-space:normal;text-align:center;line-height:1.25;overflow-wrap:anywhere}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs > button{flex:1 0 auto;min-width:auto;white-space:nowrap;padding:7px 10px;overflow:visible}
.segm button{white-space:nowrap}
.layer > span:nth-child(2){min-width:0;flex:1}
.layer b,.layer small{overflow-wrap:anywhere}
.cell em{overflow-wrap:anywhere}
.hint{white-space:normal;text-align:center}

/* alerts, tabs, day details, extras, my cities */
.alerts{display:flex;flex-direction:column;gap:6px;margin:8px 0 2px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid;font-size:13px;line-height:1.35}
.alert b{display:block;font-size:14px;margin-bottom:1px}
.alert .dot{width:9px;height:9px;border-radius:50%;background:currentColor;margin-top:5px;flex:none}
.alert.l1{background:rgba(255,211,92,.09);border-color:rgba(255,211,92,.38);color:#ffe3a0}
.alert.l2{background:rgba(255,122,89,.11);border-color:rgba(255,122,89,.45);color:#ffc5b6}
.alert.l3{background:rgba(224,48,106,.14);border-color:rgba(224,48,106,.55);color:#ffb1c8}
.tabs{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--raise);border:1px solid var(--line);margin-bottom:10px}
.tabs button{flex:1;padding:7px 4px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:13px;font-weight:500;min-width:0}
.tabs button[aria-selected="true"]{background:rgba(124,196,255,.18);color:var(--fg)}
.day{cursor:pointer;border-radius:8px}
.day:hover{background:rgba(124,196,255,.05)}
.day .rc{min-width:0}
.day .wnd{display:block;font:11px var(--mono);color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayx{overflow-x:auto;padding:4px 0 10px;border-bottom:1px solid var(--line)}
.dayx table{border-collapse:collapse;font:12px var(--mono);width:100%;min-width:330px;font-variant-numeric:tabular-nums}
.dayx td,.dayx th{padding:5px 4px;text-align:right;white-space:nowrap}
.dayx tr+tr td{border-top:1px solid var(--line)}
.dayx th{color:var(--muted);font:500 11px var(--body)}
.dayx td:first-child,.dayx th:first-child{text-align:left}
.dayx td:nth-child(2){text-align:center}
.dayx .wx-ico{vertical-align:middle}
.cities{position:absolute;top:54px;left:0;right:0;border-radius:16px;padding:8px;max-height:min(62vh,500px);overflow:auto}
.cities h3{margin:6px 8px 8px;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between}
.crow{display:flex;align-items:center;gap:6px;padding:6px;border-radius:12px}
.crow:hover{background:rgba(124,196,255,.07)}
.crow .open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:2px}
.crow .nm{flex:1;min-width:0}
.crow .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .nm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .tt{font:700 19px var(--mono);font-variant-numeric:tabular-nums}
.mini{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:none;display:grid;place-items:center;color:var(--muted);padding:0;flex:none}
.mini:hover{color:var(--fg);border-color:var(--ice)}
.home-badge{font:600 10px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--sun);margin-left:6px;vertical-align:2px}
.empty{padding:12px 10px 14px;color:var(--muted);font-size:14px;line-height:1.4}
.addcur{width:100%;margin-top:6px;padding:10px;border-radius:12px;border:1px dashed var(--ice);background:rgba(124,196,255,.08);font-weight:600}
.qbtn.saved{border-color:rgba(255,179,92,.6);color:var(--sun)}
#wxIso,#wxWind{position:fixed;inset:0;pointer-events:none;z-index:1}

/* settings, peek card, reticle, month */
.settings{position:fixed;z-index:8;top:calc(70px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:min(360px,calc(100vw - 24px));border-radius:18px;padding:10px 14px 14px;max-height:calc(100vh - 100px);overflow:auto}
.settings h3{display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px;font:700 15px var(--display)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.srow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.srow input[type=checkbox]{width:22px;height:22px;accent-color:var(--ice);flex:none}
.segm{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--raise);border:1px solid var(--line);flex:none}
.segm button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--muted)}
.segm button[aria-checked="true"]{background:rgba(124,196,255,.22);color:var(--fg)}
.snote{color:var(--muted);font-size:12px;line-height:1.4;margin-top:10px}
.reticle{position:fixed;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:2;pointer-events:none;border:2px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 1px rgba(5,7,13,.5),inset 0 0 0 1px rgba(5,7,13,.4)}
.reticle::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#fff}
.peek{position:fixed;z-index:4;left:50%;translate:-50% 0;top:calc(70px + env(safe-area-inset-top,0px));width:min(380px,calc(100vw - 24px));border-radius:18px;padding:12px 14px;text-align:left;cursor:pointer;transition:opacity .25s}
.peek.loading{opacity:.82}
.peek:hover{border-color:var(--ice)}
.pk-top{display:flex;align-items:center;gap:10px}
.pk-name{flex:1;min-width:0}
.pk-name b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-name small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-t{font:400 38px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pk-desc{margin-top:6px;font-size:13px;color:var(--muted)}
.pk-nc{margin-top:6px;font-size:14px;font-weight:600}
.pk-hours{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.ph{display:flex;flex-direction:column;align-items:center;gap:1px;font-variant-numeric:tabular-nums}
.ph small{font:11px var(--mono);color:var(--muted)}
.ph b{font:600 13px var(--mono)}
body.sheet-open:not(.sheet-min) .peek{display:none}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 0 6px}
.mhead b{font:700 16px var(--display)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.mw{text-align:center;font:600 11px var(--body);color:var(--muted);padding-bottom:2px}
.mc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px 8px;border-radius:10px;background:var(--raise);border:1px solid var(--line);font-variant-numeric:tabular-nums;overflow:hidden;min-width:0}
.mc.blank{background:none;border-color:transparent}
.mc.approx{opacity:.62;border-style:dashed}
.mc .md{font:600 12px var(--mono)}
.mc .md small{font:10px var(--body);color:var(--muted)}
.mc.we .md{color:var(--warn)}
.mc b{font:600 12px var(--mono)}
.mc > small{font:11px var(--mono);color:var(--muted)}
.mc .mp{position:absolute;left:0;bottom:0;height:3px;background:var(--rain)}

/* ===== v1.4: colour system, sky, animated icons, events, route, voice ===== */
:root{
  --fg:#eef3fc; --muted:#a3b6d3; --head:#9fd3ff;
  --k-wind:#86d8ff; --k-press:#c7a8ff; --k-hum:#6fe3c8; --k-cloud:#c3cee0; --k-rain:#6db3ff; --k-uv:#ffd36b; --k-sun:#ffc27a;
  --k-storm:#ff9f86; --k-moon:#e3d9ff; --k-kp:#9be7a8; --k-water:#5fd6ee; --k-geo:#b9dc8f; --k-air:#93e4b5; --k-fish:#6fd0ff;
  --k-health:#ffa3b8; --k-photo:#ffb46b; --k-run:#8cf0a5; --k-dry:#a8e1ff; --k-soil:#d8b27c; --k-snow:#dbe4ff; --k-aurora:#7dffb2; --k-hist:#f2c46d;
}
:root[data-theme="light"]{ --head:#1d67b5; }
:root[data-theme="light"] .cell[data-k] b{color:color-mix(in srgb, var(--k) 55%, #0c1630)}
:root[data-theme="light"] .cell[data-k] small::before{background:color-mix(in srgb, var(--k) 70%, #0c1630)}
.section h4{color:var(--head)}
.section h4 span{color:var(--muted)}
.place h2{background:linear-gradient(90deg,var(--fg),color-mix(in srgb,var(--head) 70%,var(--fg)));-webkit-background-clip:text;background-clip:text;color:transparent}
.cell[data-k]{background:linear-gradient(160deg,color-mix(in srgb,var(--k) 11%,transparent),transparent 70%),var(--raise);border-color:color-mix(in srgb,var(--k) 26%,var(--line))}
.cell[data-k] small{display:flex;align-items:center;gap:6px}
.cell[data-k] small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--k);flex:none;box-shadow:0 0 8px var(--k)}
.cell[data-k] b{color:var(--k)}
.cell.link{cursor:pointer}
.cell.link b::after{content:" ›";opacity:.7}
.day .range .lo.tc,.day .range .hi.tc{color:var(--t)}
:root[data-theme="light"] .day .range .lo.tc,:root[data-theme="light"] .day .range .hi.tc{color:color-mix(in srgb, var(--t) 52%, #0c1630)}
.day .dname{color:var(--fg)}
.day .wnd{color:color-mix(in srgb,var(--k-wind) 60%,var(--muted))}
.day .pr{color:var(--k-rain)}
.localtime{color:var(--muted)}
.nowcast b{color:color-mix(in srgb,var(--k-rain) 45%,var(--fg))}
.answer b{color:var(--head)}

/* stars behind the globe */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#map{z-index:0}
:root[data-theme="light"] #stars{display:none}

/* live sky at the top of the weather sheet */
.sky{position:absolute;left:0;right:0;top:0;height:330px;z-index:0;pointer-events:none;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent);transition:background .8s}
.sheet > .grab,.sheet > .sheet-head,.sheet > .sheet-body{position:relative;z-index:1}
.sheet-head{border-bottom-color:transparent}
:root[data-theme="light"] .sky{opacity:.55}
.sky[data-sky="day-clear"]{background:linear-gradient(180deg,#2f7fd6,#5fa6ea 55%,#8cc3f2)}
.sky[data-sky="day-cloud"]{background:linear-gradient(180deg,#4d6283,#71859f 60%,#8c9db4)}
.sky[data-sky="dusk"]{background:linear-gradient(180deg,#3a3f7a,#a75a8a 50%,#ff9a62)}
.sky[data-sky="dawn"]{background:linear-gradient(180deg,#45619c,#d88aa0 55%,#ffcf8a)}
.sky[data-sky="night-clear"]{background:linear-gradient(180deg,#081536,#13285a 70%,#1c3772)}
.sky[data-sky="night-cloud"]{background:linear-gradient(180deg,#151d30,#26314a 70%,#2f3b55)}
.sky[data-sky="rain"]{background:linear-gradient(180deg,#2c3c55,#45597a 60%,#5a6d8c)}
.sky[data-sky="snow"]{background:linear-gradient(180deg,#6f86ab,#9db1cf 60%,#c3d1e6)}
.sky[data-sky="storm"]{background:linear-gradient(180deg,#221d38,#3b2f57 60%,#4c3f68)}
.sky[data-sky="fog"]{background:linear-gradient(180deg,#5e6a7d,#8592a5 60%,#a3aebd)}
.sky::before,.sky::after{content:"";position:absolute;inset:-40px 0 0;pointer-events:none}
.sky[data-sky="rain"]::after,.sky[data-sky="storm"]::after{background-image:repeating-linear-gradient(103deg,rgba(210,230,255,.0) 0 9px,rgba(210,230,255,.38) 9px 10px,rgba(210,230,255,0) 10px 23px);background-size:120px 120px;animation:rainfall .55s linear infinite}
.sky[data-sky="snow"]::after{background-image:radial-gradient(2.2px 2.2px at 20px 30px,#fff 60%,transparent 70%),radial-gradient(1.6px 1.6px at 70px 80px,#fff 60%,transparent 70%),radial-gradient(2px 2px at 110px 20px,#fff 60%,transparent 70%),radial-gradient(1.4px 1.4px at 150px 100px,#fff 60%,transparent 70%);background-size:170px 130px;animation:snowfall 6s linear infinite;opacity:.9}
.sky[data-sky="night-clear"]::after{background-image:radial-gradient(1.3px 1.3px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 33% 42%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 12%,#fff,transparent),radial-gradient(1px 1px at 72% 36%,#fff,transparent),radial-gradient(1.2px 1.2px at 88% 22%,#fff,transparent),radial-gradient(1px 1px at 46% 28%,#dfe8ff,transparent),radial-gradient(1.4px 1.4px at 22% 55%,#fff,transparent),radial-gradient(1px 1px at 92% 52%,#fff,transparent);animation:twinkle 4s ease-in-out infinite alternate}
.sky[data-sky="day-clear"]::before{background:radial-gradient(160px 160px at 82% 18%,rgba(255,236,170,.55),transparent 70%);animation:glow 6s ease-in-out infinite alternate}
.sky[data-sky="storm"]::before{background:rgba(220,225,255,.0);animation:lightning 7s infinite}
.sky[data-sky="fog"]::after{background:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 22px,rgba(255,255,255,.12) 22px 36px);animation:fogdrift 14s linear infinite;background-size:100% 200px}
@keyframes rainfall{to{background-position:-26px 120px}}
@keyframes snowfall{to{background-position:30px 130px}}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}
@keyframes glow{from{opacity:.7}to{opacity:1}}
@keyframes lightning{0%,88%,100%{background:rgba(220,225,255,0)}89%{background:rgba(220,225,255,.35)}90%{background:rgba(220,225,255,0)}91.5%{background:rgba(220,225,255,.25)}93%{background:rgba(220,225,255,0)}}
@keyframes fogdrift{to{background-position:0 200px}}

/* animated weather icons (big icon and the centre-of-screen card) */
.anim .wx-ico .rays{transform-box:view-box;transform-origin:24px 24px;animation:spin 14s linear infinite}
.anim .wx-ico .cl{animation:floaty 4.5s ease-in-out infinite alternate}
.anim .wx-ico .drops{animation:drip 1.1s linear infinite}
.anim .wx-ico .flakes{animation:flakes 2.6s linear infinite}
.anim .wx-ico .bolt{animation:bolt 2.8s steps(1) infinite}
.anim .wx-ico .moon{transform-box:view-box;transform-origin:30px 22px;animation:rock 6s ease-in-out infinite alternate}
.anim .wx-ico .fogl{animation:fogl 3.5s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{from{transform:translateX(-1.2px)}to{transform:translateX(1.6px)}}
@keyframes drip{0%{transform:translateY(-2px);opacity:0}25%{opacity:1}100%{transform:translateY(4px);opacity:0}}
@keyframes flakes{0%{transform:translateY(-2px);opacity:.2}30%{opacity:1}100%{transform:translateY(4px);opacity:.2}}
@keyframes bolt{0%,60%{opacity:1}62%,66%{opacity:.15}68%{opacity:1}}
@keyframes rock{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes fogl{from{transform:translateX(-2px)}to{transform:translateX(2px)}}

/* events (fires, quakes, cyclones) popups */
.maplibregl-popup-content{background:var(--panel-solid);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:14px/1.4 var(--body);box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:260px}
.maplibregl-popup-tip{border-top-color:var(--panel-solid)!important;border-bottom-color:var(--panel-solid)!important}
.maplibregl-popup-close-button{color:var(--muted);font-size:18px;padding:2px 8px}
.ev b{display:block;font-size:15px;margin-bottom:2px}
.ev small{display:block;color:var(--muted)}
.ev a{color:var(--ice)}
.ev .tag{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#0d1830}

/* history */
.hist-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.hist-chart{margin-top:12px;overflow-x:auto}
.hist-chart svg{display:block}

/* voice assistant */
.search input{padding-right:84px}
.search .mic{position:absolute;right:42px;top:4px;width:38px;height:38px;border:0;background:transparent;display:grid;place-items:center;border-radius:10px;color:var(--fg)}
.search .mic:hover{background:rgba(124,196,255,.12)}
.voice{position:fixed;z-index:9;left:50%;translate:-50% 0;bottom:calc(110px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100vw - 24px));border-radius:22px;padding:16px 16px 14px}
.voice .vq{display:flex;align-items:center;gap:12px}
.voice .orb{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#bfe6ff,#4aa3ff 55%,#3a4fd8);box-shadow:0 0 0 0 rgba(124,196,255,.6)}
.voice.listening .orb{animation:orb 1.2s ease-out infinite}
@keyframes orb{0%{box-shadow:0 0 0 0 rgba(124,196,255,.6)}100%{box-shadow:0 0 0 18px rgba(124,196,255,0)}}
.voice .vt{flex:1;min-width:0}
.voice .vt b{display:block;font-size:15px}
.voice .vt small{display:block;color:var(--muted);font-size:13px}
.voice .va{margin-top:12px;font-size:16px;line-height:1.45;color:var(--fg)}
.voice form{display:flex;gap:8px;margin-top:12px}
.voice input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--raise);padding:0 12px;outline:none}
.voice input:focus{border-color:var(--ice)}
.voice .hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip:not(.glass){background:var(--raise);border:1px solid var(--line);color:var(--fg)}

/* route */
.route{position:fixed;z-index:7;top:calc(70px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:min(400px,calc(100vw - 24px));border-radius:18px;padding:12px 14px 14px;max-height:calc(100vh - 110px);overflow:auto}
.route h3{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px;font:800 16px var(--display)}
.rf{display:flex;flex-direction:column;gap:8px}
.rf label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);position:relative}
.rf input,.rf select{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--raise);padding:0 12px;outline:none;color:var(--fg);font:15px var(--body)}
.rf input:focus,.rf select:focus{border-color:var(--ice)}
.rf .sugg{position:absolute;top:66px;left:0;right:0;z-index:2;background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rf .sugg button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-bottom:1px solid var(--line)}
.rf .sugg button small{color:var(--muted)}
.rsum{margin-top:12px;padding:12px;border-radius:14px;background:var(--raise);border:1px solid var(--line);font-size:14px}
.rsum b{display:block;font-size:16px;margin-bottom:4px}
.rlist{margin-top:10px;display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:58px 26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.rrow .rt{font-weight:700;font-variant-numeric:tabular-nums}
.rrow .rn{min-width:0}
.rrow .rn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rrow .rn small{display:block;color:var(--muted);font-size:12px}
.rrow .rv{font-weight:700;font-variant-numeric:tabular-nums}
.chipline{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){.sky::before,.sky::after,.anim .wx-ico *{animation:none!important}}

@media (max-width:760px){
  .brand span{display:none}
  .brand{padding:0 12px}
  .sheet{left:0;right:0;bottom:0;top:auto;width:auto;height:64vh;border-radius:22px 22px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);transition:height .3s ease}
  .sheet.min{height:170px}
  .grab{display:block;width:100%;height:20px;border:0;padding:0;background:none;position:relative}
  .grab::after{content:"";position:absolute;left:50%;top:8px;width:42px;height:5px;margin-left:-21px;border-radius:3px;background:rgba(255,255,255,.25)}
  .sheet-head{padding-top:4px}
  body.sheet-open .toolbar{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(64vh + 10px);flex-direction:row}
  body.sheet-open.sheet-min .toolbar{bottom:180px}
  body.sheet-open .dock, body.sheet-open .hint{display:none}
  .layers{max-height:52vh}
  .peek{top:calc(66px + env(safe-area-inset-top,0px))}
  body.sheet-open.sheet-min .peek{display:block}
  .wxpanel{bottom:0;border-radius:22px 22px 0 0;border-bottom:0;width:100%;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body.wxmode .toolbar{bottom:calc(var(--wxh,220px) + 12px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="map" role="application" aria-label="Интерактивный глобус"></div>
<canvas id="wxIso" hidden></canvas>
<canvas id="wxWind" hidden></canvas>

<div class="top">
  <div class="brand glass" aria-label="Атмосфера">
    <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="#0b1c33" stroke="#7cc4ff" stroke-width="5"/><path d="M10 36c8-6 16 6 24 0s14-8 20-2" fill="none" stroke="#ffb35c" stroke-width="5" stroke-linecap="round"/></svg>
    <span>АТМОСФЕРА</span>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
    <div class="search">
      <input id="q" class="glass" type="search" placeholder="Найти город" autocomplete="off" aria-label="Поиск места" role="combobox" aria-expanded="false" aria-controls="results">
      <button class="mic" id="mic" title="Спросить голосом" aria-label="Спросить о погоде голосом">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="locate" id="locate" title="Моё местоположение" aria-label="Показать погоду в моём местоположении">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <div class="results" id="results" role="listbox" hidden></div>
    </div>
  </div>
  <button class="icon-btn glass" id="citiesBtn" aria-expanded="false" aria-controls="cities" title="Мои города" aria-label="Мои города">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
  </button>
  <button class="icon-btn glass" id="routeBtn" aria-expanded="false" aria-controls="route" title="Погода по маршруту" aria-label="Погода по маршруту">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8 19h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/></svg>
  </button>
  <div class="cities glass" id="cities" hidden></div>
</div>

<div class="dock">

<script>
"use strict";
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem("atm:"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("atm:"+k, JSON.stringify(v)); }catch(e){} }
};
let units = store.get("units", "C");
const T = c => c==null ? "—" : Math.round(units==="F" ? c*9/5+32 : c);
const Tu = c => c==null ? "—" : T(c)+"°";
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 4000); }
async function getJSON(url, ms=15000, tries=3){
  for(let a=1;;a++){
    const ctl = new AbortController(); const id = setTimeout(()=>ctl.abort(), ms);
    try{
      const r = await fetch(url, {signal: ctl.signal});
      if(!r.ok){ const e = new Error("HTTP "+r.status); e.retry = r.status>=500 || r.status===429; throw e; }
      return await r.json();
    }catch(e){
      if(a>=tries || e.retry===false) throw e;
      await new Promise(res=>setTimeout(res, (e.message==="HTTP 429" ? 3000 : 700)*a));
    }finally{ clearTimeout(id); }
  }
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const PLAY_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const PAUSE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
$("#play").innerHTML = PLAY_ICON; $("#wxPlay").innerHTML = PLAY_ICON;

/* temperature colour scale (°C) */
const TSTOPS = [[-40,"#c7b7ff"],[-30,"#8e7cf0"],[-20,"#5a6ee8"],[-10,"#3f9de8"],[0,"#7fd6f5"],[8,"#8ee6b0"],[15,"#d9ee7a"],[22,"#ffd35c"],[28,"#ff9d4a"],[34,"#ff6a3d"],[42,"#d42c5c"]];
const tcs = c => c==null ? "" : `class="tc" style="--t:${tColor(c)}"`;
const Tc = c => c==null ? "—" : `<span ${tcs(c)}>${Tu(c)}</span>`;
function tColor(c){
  if(c<=TSTOPS[0][0]) return TSTOPS[0][1];
  for(let i=1;i<TSTOPS.length;i++){ if(c<=TSTOPS[i][0]){ const [a,ca]=TSTOPS[i-1],[b,cb]=TSTOPS[i]; return mix(ca,cb,(c-a)/(b-a)); } }
  return TSTOPS[TSTOPS.length-1][1];
}
function mix(a,b,t){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const x=p(a),y=p(b); return "#"+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,"0")).join(""); }
$("#legendBar").style.background = "linear-gradient(90deg,"+TSTOPS.filter(s=>s[0]>=-30&&s[0]<=42).map(s=>s[1]).join(",")+")";

/* WMO weather codes */
const WMO = {0:["Ясно","clear"],1:["Преимущественно ясно","clear"],2:["Переменная облачность","partly"],3:["Пасмурно","cloud"],45:["Туман","fog"],48:["Туман с изморозью","fog"],51:["Слабая морось","drizzle"],53:["Морось","drizzle"],55:["Сильная морось","drizzle"],56:["Ледяная морось","drizzle"],57:["Сильная ледяная морось","drizzle"],61:["Небольшой дождь","rain"],63:["Дождь","rain"],65:["Сильный дождь","rain"],66:["Ледяной дождь","rain"],67:["Сильный ледяной дождь","rain"],71:["Небольшой снег","snow"],73:["Снег","snow"],75:["Сильный снег","snow"],77:["Снежные зёрна","snow"],80:["Небольшой ливень","rain"],81:["Ливень","rain"],82:["Сильный ливень","rain"],85:["Снегопад","snow"],86:["Сильный снегопад","snow"],95:["Гроза","storm"],96:["Гроза с градом","storm"],99:["Сильная гроза с градом","storm"]};
function icon(code, day=1, size=28){
  const k = (WMO[code]||["","cloud"])[1];
  const sun = day ? `<circle cx="24" cy="24" r="9" fill="#ffb35c"/><g class="rays" stroke="#ffb35c" stroke-width="3" stroke-linecap="round"><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/></g>` : `<path class="moon" d="M30 10a14 14 0 1 0 10 22 12 12 0 0 1-10-22z" fill="#d6dfff"/>`;
  const cloud = (y=0,f="#cfd9e8") => `<path class="cl" d="M14 ${38+y}h22a8 8 0 0 0 0-16 11 11 0 0 0-21-2 7 7 0 0 0-1 18z" fill="${f}"/>`;
  const drops = c => `<g class="drops" stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M17 42l-2 4M25 42l-2 4M33 42l-2 4"/></g>`;
  let g;
  switch(k){
    case "clear": g = sun; break;
    case "partly": g = `<g transform="translate(-6 -6) scale(.8)">${sun}</g>`+cloud(2); break;
    case "cloud": g = cloud(-2,"#b3c0d2"); break;
    case "fog": g = `<g class="fogl" stroke="#b3c0d2" stroke-width="3.5" stroke-linecap="round"><path d="M8 18h32M5 26h38M10 34h28"/></g>`; break;
    case "drizzle": g = cloud(-6)+`<g class="drops" fill="#4aa3ff"><circle cx="17" cy="42" r="2"/><circle cx="25" cy="44" r="2"/><circle cx="33" cy="42" r="2"/></g>`; break;
    case "rain": g = cloud(-6,"#a6b6cb")+drops("#4aa3ff"); break;
    case "snow": g = cloud(-6)+`<g class="flakes" fill="#fff"><circle cx="17" cy="42" r="2.5"/><circle cx="25" cy="45" r="2.5"/><circle cx="33" cy="42" r="2.5"/></g>`; break;
    case "storm": g = cloud(-6,"#95a2b6")+`<path class="bolt" d="M26 32l-6 9h5l-3 7 9-11h-5l3-5z" fill="#ffd35c"/>`; break;

}
const DIRS = ["С","ССВ","СВ","ВСВ","В","ВЮВ","ЮВ","ЮЮВ","Ю","ЮЮЗ","ЮЗ","ЗЮЗ","З","ЗСЗ","СЗ","ССЗ"];
const dirName = d => DIRS[Math.round(d/22.5)%16];

const fmtTime = iso => iso ? iso.slice(11,16) : "—";
const DOW = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"], DOWF = ["воскресенье","понедельник","вторник","среду","четверг","пятницу","субботу"], MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];

/* ================= map ================= */
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services";

const gibs = (layer, tms, ext, bust="") => `${GIBS}/${layer}/default/default/${tms}/{z}/{y}/{x}.${ext}${bust}`;

const BASES = {
  sat:   {name:"Спутник (детально)", sub:"Снимки высокого разрешения, Esri", sw:"linear-gradient(135deg,#1d3a2a,#3c5a34 45%,#1b3150)", tiles:[`${ESRI}/World_Imagery/MapServer/tile/{z}/{y}/{x}`], max:19, attr:"Снимки © Esri, Maxar, Earthstar Geographics"},
  today: {name:"Земля сегодня", sub:"Снимок всей планеты за сегодня, NASA VIIRS", sw:"linear-gradient(135deg,#f2f5fa,#5d8ab8 50%,#2f5b3a)", tiles:[gibs("VIIRS_SNPP_CorrectedReflectance_TrueColor","GoogleMapsCompatible_Level9","jpg")], max:9, attr:"NASA GIBS / VIIRS"},
  dark:  {name:"Ночная карта", sub:"Тёмная карта с границами", sw:"linear-gradient(135deg,#0c111c,#1e2a3d)", tiles:[`${ESRI}/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}`], max:16, attr:"© Esri"}

  temps:  {name:"Температура в городах", sub:"Сейчас, в 90 городах мира", sw:"linear-gradient(90deg,#3f9de8,#8ee6b0,#ffd35c,#ff6a3d)", def:true},
  clouds: {name:"Облака сейчас", sub:"Спутники GOES и Himawari, каждые 10 мин", sw:"linear-gradient(135deg,#e9eef5,#7d93ad 60%,#28344a)", def:false},

function addRaster(id, src, opts={}){
  if(map.getLayer(id)) map.removeLayer(id);

  map.addSource(id, src);
  map.addLayer({id, type:"raster", source:id, layout:{visibility:opts.visible?"visible":"none"}, paint:Object.assign({"raster-fade-duration":200}, opts.paint||{})}, map.getLayer(LABELS_FIRST) ? LABELS_FIRST : undefined);
}

/* Russian vector labels and borders (OpenFreeMap / OpenMapTiles) */

function declutter(){

  const boxes=[], c=map.getCenter(), rad=Math.PI/180;
  if(pin){ const r=pin.getElement().getBoundingClientRect(); boxes.push({left:r.left-6,right:r.right+6,top:r.top-6,bottom:r.bottom+6}); }
  for(const m of cityMarkers){
    const el=m.getElement(), p=m.getLngLat();
    const cosd = Math.sin(c.lat*rad)*Math.sin(p.lat*rad) + Math.cos(c.lat*rad)*Math.cos(p.lat*rad)*Math.cos((p.lng-c.lng)*rad);
    if(cosd < 0.25){ el.style.visibility="hidden"; continue; }
    el.style.visibility="visible";
    const r=el.getBoundingClientRect();
    if(r.width===0) continue;
    if(boxes.some(b=>!(r.right<b.left||r.left>b.right||r.bottom<b.top||r.top>b.bottom))) el.style.visibility="hidden";
    else boxes.push(r);
  }
}

let current = null, pin = null;
async function reverseName(lat, lon){
  try{
    const d = await getJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ru`, 8000, 2);
    const name = d.city || d.locality || d.principalSubdivision || d.countryName;
    const sub = [d.city && d.principalSubdivision !== d.city ? d.principalSubdivision : "", d.countryName].filter(Boolean).join(", ");
    if(!name) return {name: oceanName(lat,lon), sub:""};
    return {name, sub: sub===name ? "" : sub};
  }catch(e){ return {name:"Выбранная точка", sub:""}; }
}
function oceanName(lat,lon){
  if(lat>66) return "Северный Ледовитый океан"; if(lat<-60) return "Южный океан";
  if(lon>20 && lon<120 && lat<25) return "Индийский океан";
  if(lon>-70 && lon<20) return "Атлантический океан";
  return "Тихий океан";
}

function fetchWeather(lat,lon){

async function fetchExtras(lat,lon){

function fetchAir(lat,lon){

}

/* ---- short-term precipitation story ("rain ends around 22:00") ---- */
function nowcast(w){
  const m = w.minutely_15, nowIso = w.current.time;
  const kindOf = (p,s) => s>0 && s*0.7 >= p*0.5 ? "snow" : "rain";
  const word = {rain:["Дождь","дождь"], snow:["Снег","снег"]};
  if(!m || !m.time){ return {text:"", bars:[]}; }
  let i0 = m.time.findIndex(t => t > nowIso); i0 = Math.max(0, i0-1);
  const P = m.precipitation.slice(i0), S = (m.snowfall||[]).slice(i0), Tm = m.time.slice(i0);
  const wet = k => (P[k]||0) >= 0.05;
  const bars = P.slice(0,24).map((p,k)=>({p, snow: kindOf(p,S[k]||0)==="snow"}));
  const nowWet = wet(0) || (w.current.precipitation||0) > 0;
  const kind0 = kindOf(Math.max(P[0]||0, w.current.precipitation||0), Math.max(S[0]||0, w.current.snowfall||0));
  let text;
  if(nowWet){
    let end = -1;
    for(let k=1;k<P.length-1;k++) if(!wet(k) && !wet(k+1)){ end=k; break; }
    text = end>0 ? `${word[kind0][0]} закончится около ${Tm[end].slice(11,16)}` : `${word[kind0][0]} продлится ещё несколько часов`;
  } else {
    let start = -1;
    for(let k=1;k<P.length;k++) if(wet(k)){ start=k; break; }
    if(start>0){ const kd = kindOf(P[start], S[start]||0); text = `${start<=2?"Скоро":"Около "+Tm[start].slice(11,16)} начнётся ${word[kd][1]}`; }
    else {
      const h = w.hourly, hi = Math.max(0, h.time.findIndex(t => t >= nowIso.slice(0,13)+":00"));
      let nxt = -1; for(let k=hi;k<hi+24 && k<h.time.length;k++) if((h.precipitation[k]||0)>=0.2){ nxt=k; break; }
      text = nxt<0 ? "Ближайшие сутки без осадков" : `Без осадков примерно до ${h.time[nxt].slice(11,16)}${h.time[nxt].slice(0,10)!==nowIso.slice(0,10)?" завтра":""}`;
    }
  }
  return {text, bars, start: Tm[0]};
}

const cell = (label, value, note="") => { const k = (KIND.find(([r]) => r.test(label))||[])[1]; return `<div class="cell"${k ? ` data-k style="--k:var(--k-${k})"` : ""}><small>${label}</small><b>${value}</b>${note?`<em>${note}</em>`:""}</div>`; };
function answer([title, text]){
  const a = $("#answer"); a.hidden=false; a.innerHTML = `<b>${esc(title)}</b>${esc(text)}`;
  a.scrollIntoView({block:"nearest", behavior:"smooth"});

function dayDetail(w, i){
  const h = w.hourly, day = w.daily.time[i];
  const rows = [];
  for(let k=0;k<h.time.length;k++){
    const t = h.time[k]; if(t.slice(0,10)!==day) continue;
    const hr = +t.slice(11,13); if(hr%3) continue;
    rows.push(`<tr><td>${t.slice(11,16)}</td><td>${icon(h.weather_code[k], h.is_day[k], 22)}</td><td ${tcs(h.temperature_2m[k])}>${Tu(h.temperature_2m[k])}</td><td>${(h.precipitation[k]||0)>0?h.precipitation[k].toFixed(1):"—"}</td><td>${dirName(h.wind_direction_10m[k])} ${Math.round(h.wind_speed_10m[k])}<span style="color:var(--muted)">/${Math.round(h.wind_gusts_10m[k])}</span></td><td>${Math.round(h.pressure_msl[k]*0.750062)}</td></tr>`);
  }
  if(!rows.length) return `<div class="empty">Нет почасовых данных для этого дня.</div>`;
  return `<table><thead><tr><th>Время</th><th></th><th>°</th><th>Осадки, мм</th><th>Ветер, м/с</th><th>Давл., мм</th></tr></thead><tbody>${rows.join("")}</tbody></table>`;
}
function tomorrowText(w){
  const d = w.daily, i = 1;
  const pr = d.precipitation_sum[i]||0, sn = d.snowfall_sum[i]||0;
  const precip = pr<0.2 ? "без осадков" : sn>0.5 ? `снег, около ${sn.toFixed(0)} см` : `дождь, ${pr.toFixed(1)} мм (вероятность ${d.precipitation_probability_max[i]}%)`;
  return ["Завтра", `${(WMO[d.weather_code[i]]||["—"])[0]}. Днём до ${Tu(d.temperature_2m_max[i])}, ночью ${Tu(d.temperature_2m_min[i])}; ${precip}; ветер ${dirName(d.wind_direction_10m_dominant[i])} до ${Math.round(d.wind_speed_10m_max[i])} м/с, порывы до ${Math.round(d.wind_gusts_10m_max[i])} м/с.`];
}
function carWashText(w){
  const d = w.daily, dry = i => (d.precipitation_sum[i]||0) < 0.5 && (d.precipitation_probability_max[i]??0) < 40;
  for(let i=0;i<d.time.length-2;i++){
    if(dry(i) && dry(i+1) && dry(i+2)){
      const dt = new Date(d.time[i]+"T12:00:00");
      const when = i===0 ? "Сегодня" : i===1 ? "Завтра" : `В ${DOWF[dt.getDay()]}, ${dt.getDate()} ${MON[dt.getMonth()]}`;
      return ["Когда мыть машину", `${when}: после этого минимум три дня без дождя и снега.`];
    }
  }
  return ["Когда мыть машину", "В ближайшие две недели нет трёх сухих дней подряд. Лучше подождать или выбрать мойку с защитным покрытием."];
}
function wearText(w){
  const t = w.current.apparent_temperature, p = (w.daily.precipitation_probability_max[0]??0), wind = w.current.wind_speed_10m;
  let s = t<-15 ? "Пуховик, шапка, шарф и тёплые варежки" : t<-5 ? "Зимняя куртка, шапка и перчатки" : t<5 ? "Тёплая куртка, шапка" : t<12 ? "Куртка или плотная толстовка" : t<18 ? "Лёгкая куртка или свитер" : t<24 ? "Футболка, на вечер лёгкая кофта" : "Лёгкая одежда, головной убор от солнца";
  if(p>=50) s += "; возьмите зонт"; if(wind>=8) s += "; ветрено, пригодится капюшон";
  if((w.current.uv_index??0)>=6) s += "; нужен солнцезащитный крем";

async function shareForecast(w){
  const c = w.current, d = w.daily;
  const text = `${current.name}: сейчас ${Tu(c.temperature_2m)}, ${(WMO[c.weather_code]||["—"])[0].toLowerCase()}, ветер ${c.wind_speed_10m.toFixed(0)} м/с. ${nowcast(w).text}. Завтра ${Tu(d.temperature_2m_min[1])}…${Tu(d.temperature_2m_max[1])}, ${(WMO[d.weather_code[1]]||["—"])[0].toLowerCase()}.`;
  const url = location.href.split("#")[0];
  try{
    if(navigator.share){ await navigator.share({title:"Погода — Атмосфера", text, url}); return; }
  }catch(e){ if(e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(text+" "+url); toast("Прогноз скопирован — вставьте его в любой мессенджер"); }
  catch(e){ answer(["Скопируйте текст", text+" "+url]); }
}

/* ---- yesterday, pressure trend ---- */
function yesterdayText(w, ex){
  const y = ex?.yday?.hourly; if(!y) return "";
  const now = w.current.time, dt = new Date(now.slice(0,10)+"T12:00:00Z"); dt.setUTCDate(dt.getUTCDate()-1);
  const key = dt.toISOString().slice(0,10)+"T"+now.slice(11,13)+":00";
  const k = y.time.indexOf(key); if(k<0 || y.temperature_2m[k]==null) return "";
  const diff = Math.round(w.current.temperature_2m - y.temperature_2m[k]);
  if(Math.abs(diff)<1) return "Так же, как вчера в это время";
  return `${diff>0?"Теплее":"Холоднее"}, чем вчера в это время, на ${Math.abs(units==="F"?Math.round(diff*9/5):diff)}°`;
}
function pressureTrend(w){
  const h = w.hourly, i = Math.max(0, h.time.findIndex(t => t >= w.current.time.slice(0,13)+":00"));
  const a = h.pressure_msl[i], b = h.pressure_msl[Math.min(h.time.length-1, i+6)];
  if(a==null||b==null) return "";
  const d = (b-a)*0.750062;
  return Math.abs(d)<0.8 ? "без изменений" : d>0 ? `растёт (+${d.toFixed(0)} мм за 6 ч)` : `падает (${d.toFixed(0)} мм за 6 ч)`;
}

/* ---- weather warnings derived from the forecast (not official) ---- */
function alerts(w){
  const h = w.hourly, d = w.daily, now = w.current.time;
  const i0 = Math.max(0, h.time.findIndex(t => t >= now.slice(0,13)+":00")), i1 = Math.min(h.time.length, i0+48);
  const today = now.slice(0,10);
  const when = i => { const t = h.time[i], dd = Math.round((Date.parse(t.slice(0,10)) - Date.parse(today))/864e5);
    return `${dd===0?"сегодня":dd===1?"завтра":"послезавтра"} около ${t.slice(11,13)}:00`; };
  const out = [];
  let g=-1, gi=i0; for(let i=i0;i<i1;i++) if((h.wind_gusts_10m[i]||0)>g){ g=h.wind_gusts_10m[i]; gi=i; }
  if(g>=25) out.push({level:3,title:"Штормовой ветер",text:`Порывы до ${Math.round(g)} м/с ${when(gi)}. Держитесь подальше от деревьев и рекламных щитов.`});
  else if(g>=20) out.push({level:2,title:"Очень сильный ветер",text:`Порывы до ${Math.round(g)} м/с ${when(gi)}.`});
  else if(g>=15) out.push({level:1,title:"Сильный ветер",text:`Порывы до ${Math.round(g)} м/с ${when(gi)}.`});
  const ti = (()=>{ for(let i=i0;i<i1;i++) if(h.weather_code[i]>=95) return i; return -1; })();
  if(ti>=0) out.push({level: h.weather_code[ti]>=96?3:2, title: h.weather_code[ti]>=96?"Гроза с градом":"Гроза", text:`Ожидается ${when(ti)}.`});
  let pm=0, pi=i0; for(let i=i0;i<i1;i++) if((h.precipitation[i]||0)>pm){ pm=h.precipitation[i]; pi=i; }
  if(pm>=8) out.push({level:2,title:"Ливень",text:`До ${pm.toFixed(0)} мм за час ${when(pi)}.`});
  else if((d.precipitation_sum[0]||0)>=25 || (d.precipitation_sum[1]||0)>=25) out.push({level:2,title:"Сильный дождь",text:`До ${Math.round(Math.max(d.precipitation_sum[0]||0,d.precipitation_sum[1]||0))} мм за сутки.`});
  let sn=0; for(let i=i0;i<Math.min(i1,i0+24);i++) sn += h.snowfall[i]||0;
  if(sn>=6) out.push({level:2,title:"Сильный снегопад",text:`До ${Math.round(sn)} см снега за сутки.`});
  else if(sn>=2) out.push({level:1,title:"Снегопад",text:`Около ${Math.round(sn)} см снега за сутки.`});

const sound = {

  noise(type){

  },
  build(){

    const windSrc = this.noise("brown"), windF = c.createBiquadFilter(); windF.type="lowpass"; windF.frequency.value=500; windF.Q.value=3;

function closeCities(){ $("#cities").hidden = true; $("#citiesBtn").setAttribute("aria-expanded","false"); }

/* ================= search ================= */
let sTimer=null, sIdx=-1, sItems=[], sSeq=0;
$("#q").addEventListener("input", e => {
  clearTimeout(sTimer); const q=e.target.value.trim();
  if(q.length<2){ hideResults(); return; }
  sTimer=setTimeout(()=>search(q), 280);
});
async function search(q){
  const seq = ++sSeq;
  try{
    const d = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=ru&format=json`, 10000);
    if(seq !== sSeq) return;
    sItems = d.results || [];
    const r=$("#results"); r.innerHTML="";
    if(!sItems.length){ r.innerHTML=`<button disabled>Ничего не найдено<small>Попробуйте другое написание</small></button>`; }
    sItems.forEach((it,i)=>{
      const b=document.createElement("button"); b.setAttribute("role","option");
      b.innerHTML = `${esc(it.name)}<small>${esc([it.admin1, it.country].filter(Boolean).join(", "))}${it.population?` · ${(it.population>=1e6?(it.population/1e6).toFixed(1)+" млн":Math.round(it.population/1000)+" тыс.")} жителей`:""}</small>`;
      b.onclick=()=>pick(i); r.appendChild(b);
    });
    r.hidden=false; $("#q").setAttribute("aria-expanded","true"); sIdx=-1;
  }catch(e){ if(seq===sSeq) toast("Поиск не ответил. Попробуйте ещё раз."); }
}
function pick(i){
  const it=sItems[i]; if(!it) return;
  hideResults(); $("#q").value=it.name; $("#q").blur();
  const z = it.feature_code?.startsWith("PCL") ? 3.5 : it.feature_code==="ADM1" ? 5 : 8;
  openPlace(it.latitude, it.longitude, {name:it.name, sub:[it.admin1, it.country].filter(Boolean).join(", "), zoom:z});
}
function hideResults(){ $("#results").hidden=true; $("#q").setAttribute("aria-expanded","false"); }
$("#q").addEventListener("keydown", e => {
  const btns=[...$("#results").querySelectorAll("button:not([disabled])")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!btns.length) return; sIdx=(sIdx+(e.key==="ArrowDown"?1:-1)+btns.length)%btns.length; btns.forEach((b,i)=>b.classList.toggle("active",i===sIdx)); }
  if(e.key==="Enter"){ e.preventDefault(); if(sItems.length) pick(sIdx<0?0:sIdx); }
  if(e.key==="Escape") hideResults();
});
document.addEventListener("click", e => { if(!e.target.closest(".search")) hideResults(); });

$("#locate").onclick = () => {

    {enableHighAccuracy:true, timeout:10000});
};

/* ================= «под прицелом»: weather at the centre of the screen ================= */
const peek = {data:null, key:"", timer:null, last:0, seq:0, cache:new Map()};
function peekAllowed(){ return settings.peek && !wx.active && ($("#sheet").hidden || $("#sheet").classList.contains("min")); }
function peekHide(){ $("#peek").hidden = true; $("#reticle").hidden = true; if(peek.data){ peek.data = null; sound.update(); } }
function peekUpdate(force){
  clearTimeout(peek.timer);
  if(!peekAllowed()){ $("#peek").hidden = true; $("#reticle").hidden = true; return; }
  $("#reticle").hidden = false;
  const wait = spinning && !force ? Math.max(0, 6000 - (Date.now()-peek.last)) : 450;
  peek.timer = setTimeout(peekLoad, wait);
}
async function peekLoad(){
  if(!peekAllowed()) return;
  const c = map.getCenter(), z = map.getZoom(), lat = c.lat, lon = ((c.lng+540)%360)-180;
  const step = z < 3 ? 1 : z < 6 ? 0.25 : 0.05, key = (Math.round(lat/step)*step).toFixed(2)+","+(Math.round(lon/step)*step).toFixed(2);
  if(key === peek.key && peek.data){ $("#peek").hidden = false; $("#peek").classList.remove("loading"); renderPeek(); sound.update(); return; }
  peek.key = key; peek.last = Date.now(); const seq = ++peek.seq;
  $("#peek").hidden = false; $("#peek").classList.add("loading");
  try{
    let hit = peek.cache.get(key);
    if(!hit || Date.now()-hit.at > 10*60*1000){
      const [w, n] = await Promise.all([
        getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&current=temperature_2m,apparent_temperature,weather_code,is_day,precipitation,snowfall,wind_speed_10m,wind_gusts_10m,wind_direction_10m,pressure_msl&hourly=temperature_2m,weather_code,is_day,precipitation&minutely_15=precipitation,snowfall&forecast_minutely_15=32&past_minutely_15=1&forecast_hours=8&timezone=auto&wind_speed_unit=ms`, 12000, 2),
        reverseName(lat, lon)
      ]);
      hit = {at:Date.now(), w, n, lat, lon}; peek.cache.set(key, hit);
      if(peek.cache.size > 60) peek.cache.delete(peek.cache.keys().next().value);
    }
    if(seq !== peek.seq || !peekAllowed()) return;
    peek.data = hit; renderPeek(); sound.update();
  }catch(e){ if(seq === peek.seq){ $("#peek").classList.remove("loading"); $("#peekBody").textContent = "Не удалось загрузить погоду для этого места"; } }
}
function renderPeek(){
  const {w, n} = peek.data, c = w.current, h = w.hourly;
  const nc = w.minutely_15 ? nowcast(w).text.replace("Ближайшие сутки без осадков","В ближайшие часы без осадков") : "";
  const i0 = Math.max(0, h.time.findIndex(t => t >= c.time.slice(0,13)+":00"));
  const hours = [1,2,3,4,5,6].map(k => i0+k).filter(i => i < h.time.length)
    .map(i => `<span class="ph"><small>${h.time[i].slice(11,16)}</small>${icon(h.weather_code[i], h.is_day[i], 22)}<b ${tcs(h.temperature_2m[i])}>${Tu(h.temperature_2m[i])}</b></span>`).join("");
  $("#peek").classList.remove("loading");
  $("#peekBody").innerHTML = `
    <div class="pk-top anim">${icon(c.weather_code, c.is_day, 42)}
      <div class="pk-name"><b>${esc(n.name)}</b><small>${esc(n.sub || "")}${n.sub?" · ":""}${fmtTime(c.time)} местное</small></div>
      <div class="pk-t tc" style="--t:${tColor(c.temperature_2m)}">${Tu(c.temperature_2m)}</div></div>
    <div class="pk-desc">${esc((WMO[c.weather_code]||["—"])[0])} · ощущается ${Tc(c.apparent_temperature)} · ветер ${c.wind_speed_10m.toFixed(0)} м/с · ${Math.round(c.pressure_msl*0.750062)} мм</div>
    ${nc ? `<div class="pk-nc">${esc(nc)}</div>` : ""}
    <div class="pk-hours">${hours}</div>`;
}
$("#peek").onclick = () => { if(!peek.data) return; const d = peek.data; openPlace(d.lat, d.lon, {name:d.n.name, sub:d.n.sub, zoom: Math.max(map.getZoom(), 5)}); };
map.on("moveend", () => peekUpdate(false));
map.on("movestart", () => { if(!spinning) $("#peek").classList.add("loading"); });

/* ================= month forecast ================= */
async function showMonth(){
  const w = current?.wx; if(!w) return;
  const token = current, body = $("#body");
  body.innerHTML = `<div class="mhead"><button class="qbtn" id="mBack">← Назад</button><b>Прогноз на месяц</b></div><div class="loading">Считаю прогноз на 35 дней…</div>`;
  $("#mBack").onclick = () => renderWeather();
  body.scrollTop = 0;
  let ens = null;
  try{ ens = await getJSON(`https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${current.lat}&longitude=${current.lon}&models=gfs05&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&forecast_days=35&timezone=auto`, 20000, 2); }
  catch(e){ ens = null; }
  if(current !== token || !$("#mBack")) return;
  const d = w.daily, days = [];
  d.time.forEach((t,i) => days.push({t, code:d.weather_code[i], hi:d.temperature_2m_max[i], lo:d.temperature_2m_min[i], p:d.precipitation_sum[i]||0, prob:d.precipitation_probability_max[i], approx:false}));
  if(ens?.daily){
    const e = ens.daily, mean = (base, i) => { let s=0, n=0; for(const k in e) if(k===base || k.startsWith(base+"_member")){ const v=e[k][i]; if(v!=null){ s+=v; n++; } } return n ? s/n : null; };
    const wetShare = i => { let wet=0, n=0; for(const k in e) if(k==="precipitation_sum" || k.startsWith("precipitation_sum_member")){ const v=e[k][i]; if(v!=null){ n++; if(v>=1) wet++; } } return n ? Math.round(wet/n*100) : null; };
    e.time.forEach((t,i) => {
      if(t <= days[days.length-1].t) return;
      const hi = mean("temperature_2m_max", i), lo = mean("temperature_2m_min", i), prob = wetShare(i), p = mean("precipitation_sum", i)||0;
      const snow = hi!=null && hi < 1;
      const code = prob>=60 ? (snow?73:63) : prob>=35 ? (snow?71:61) : prob>=20 ? 3 : 2;
      days.push({t, code, hi, lo, p, prob, approx:true});
    });
  }
  const first = new Date(days[0].t+"T12:00:00"), lead = (first.getDay()+6)%7;
  const cells = Array(lead).fill(`<div class="mc blank"></div>`).concat(days.map(x => {
    const dt = new Date(x.t+"T12:00:00");
    return `<div class="mc${x.approx?" approx":""}${dt.getDay()%6===0?" we":""}" title="${esc((WMO[x.code]||["—"])[0])}${x.prob!=null?`, осадки ${x.prob}%`:""}">
      <span class="md">${dt.getDate()}${dt.getDate()===1||x===days[0]?` <small>${MON[dt.getMonth()]}</small>`:""}</span>
      ${icon(x.code, 1, 24)}
      <b ${tcs(x.hi)}>${Tu(x.hi)}</b><small ${tcs(x.lo)}>${Tu(x.lo)}</small>
      ${x.prob!=null ? `<i class="mp" style="width:${clamp(x.prob,0,100)}%"></i>` : ""}
    </div>`;
  }));
  const hiDay = days.reduce((a,b)=> (b.hi??-99) > (a.hi??-99) ? b : a), loDay = days.reduce((a,b)=> (b.lo??99) < (a.lo??99) ? b : a);
  const wet = days.filter(x => (x.prob??0) >= 50 || x.p >= 2).length;
  const fmtD = t => { const dt = new Date(t+"T12:00:00"); return `${dt.getDate()} ${MON[dt.getMonth()]}`; };
  body.innerHTML = `<div class="mhead"><button class="qbtn" id="mBack">← Назад</button><b>Прогноз на ${days.length} дней</b></div>
    <div class="answer"><b>Коротко о месяце</b>Самый тёплый день — ${fmtD(hiDay.t)} (до ${Tu(hiDay.hi)}), самый холодный — ${fmtD(loDay.t)} (до ${Tu(loDay.lo)}). Дней с осадками: около ${wet}.</div>
    <div class="mgrid" role="grid">${["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>`<div class="mw">${x}</div>`).join("")}${cells.join("")}</div>
    <div class="snote">Полоска внизу дня — вероятность осадков. Первые ${d.time.length} дней — основной прогноз; дальше (бледные клетки) — ориентировочно, по 31 варианту модели GFS${ens?"":" (сейчас недоступно)"}.</div>`;
  $("#mBack").onclick = () => renderWeather();
}

/* ================= v1.4: astronomy (sun & moon times; after SunCalc by V. Agafonkin, BSD) ================= */
const SC = (() => {
  const PI = Math.PI, sin = Math.sin, cos = Math.cos, tan = Math.tan, asin = Math.asin, atan = Math.atan2, acos = Math.acos, rad = PI/180;
  const dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad*23.4397, J0 = 0.0009;
  const toJulian = d => d.valueOf()/dayMs - 0.5 + J1970, fromJulian = j => new Date((j + 0.5 - J1970)*dayMs), toDays = d => toJulian(d) - J2000;
  const ra = (l,b) => atan(sin(l)*cos(e) - tan(b)*sin(e), cos(l)), dec = (l,b) => asin(sin(b)*cos(e) + cos(b)*sin(e)*sin(l));
  const alt = (H,phi,d) => asin(sin(phi)*sin(d) + cos(phi)*cos(d)*cos(H));
  const sidereal = (d,lw) => rad*(280.16 + 360.9856235*d) - lw;
  const refr = h => { if(h < 0) h = 0; return 0.0002967/Math.tan(h + 0.00312536/(h + 0.08901179)); };
  const M_ = d => rad*(357.5291 + 0.98560028*d);
  const L_ = M => M + rad*(1.9148*sin(M) + 0.02*sin(2*M) + 0.0003*sin(3*M)) + rad*102.9372 + PI;
  const cycle = (d,lw) => Math.round(d - J0 - lw/(2*PI)), transitA = (Ht,lw,n) => J0 + (Ht + lw)/(2*PI) + n;
  const transitJ = (ds,M,L) => J2000 + ds + 0.0053*sin(M) - 0.0069*sin(2*L);
  const hourAngle = (h,phi,d) => acos((sin(h) - sin(phi)*sin(d))/(cos(phi)*cos(d)));
  function times(date, lat, lng, angle){
    const lw = rad*-lng, phi = rad*lat, d = toDays(date), n = cycle(d,lw), ds = transitA(0,lw,n), M = M_(ds), L = L_(M), dc = dec(L,0), Jnoon = transitJ(ds,M,L);
    const w = hourAngle(angle*rad, phi, dc), Jset = transitJ(transitA(w,lw,n), M, L);
    return {rise: fromJulian(Jnoon - (Jset - Jnoon)), set: fromJulian(Jset)};
  }
  function moonCoords(d){
    const L = rad*(218.316 + 13.176396*d), M = rad*(134.963 + 13.064993*d), F = rad*(93.272 + 13.229350*d);
    const l = L + rad*6.289*sin(M), b = rad*5.128*sin(F);
    return {ra: ra(l,b), dec: dec(l,b)};
  }
  function moonAlt(date, lat, lng){
    const lw = rad*-lng, phi = rad*lat, d = toDays(date), c = moonCoords(d), H = sidereal(d,lw) - c.ra;
    const h = alt(H, phi, c.dec); return h + refr(h);
  }
  function moonTimes(t0, lat, lng){
    const later = h => new Date(t0.valueOf() + h*3600e3), hc = 0.133*rad;

  if(yT != null && Math.abs(c.temperature_2m - yT) >= 8) f.push("резкая смена температуры");
  if(c.relative_humidity_2m >= 90 && c.temperature_2m >= 22) f.push("духота");
  if(c.temperature_2m >= 30) f.push("жара");
  out.push(cell("Самочувствие", f.length >= 2 ? "неблагоприятно" : f.length ? "умеренно" : "благоприятно", f.length ? f.join(", ") : "погода спокойная, без резких перемен"));
  /* best time for a run or walk */
  let best = null;
  for(let i = i0+1; i < Math.min(h.time.length, i0+19); i++){
    if(!h.is_day[i] || (h.precipitation_probability[i]??0) >= 35 || h.wind_speed_10m[i] >= 8) continue;
    const s = -Math.abs(h.apparent_temperature[i] - 12) - h.wind_speed_10m[i]*.5 - (h.precipitation_probability[i]??0)/20;
    if(!best || s > best.s) best = {s, i};
  }
  out.push(best ? cell("Время для пробежки", `${h.time[best.i].slice(11,16)}${h.time[best.i].slice(0,10) !== c.time.slice(0,10) ? " завтра" : ""}`, `ощущается как ${Tu(h.apparent_temperature[best.i])}, ветер ${Math.round(h.wind_speed_10m[best.i])} м/с, без осадков`)
    : cell("Время для пробежки", "не лучший день", "в светлое время ближайших 18 часов дождь или сильный ветер"));
  /* laundry drying outdoors */
  let run = null, curRun = null;
  for(let i = i0; i < Math.min(h.time.length, i0+30); i++){
    const ok = h.is_day[i] && (h.precipitation_probability[i]??0) < 20 && (h.precipitation[i]||0) === 0 && (at(h.relative_humidity_2m, i)??60) < 78 && h.temperature_2m[i] >= 3;
    if(ok){ curRun = curRun ? {a:curRun.a, b:i} : {a:i, b:i}; if(!run || curRun.b - curRun.a > run.b - run.a) run = {...curRun}; } else curRun = null;
  }
  out.push(run && run.b - run.a >= 2 ? cell("Сушка белья на улице", `${h.time[run.a].slice(11,16)}–${h.time[run.b+1]?.slice(11,16) || h.time[run.b].slice(11,16)}${h.time[run.a].slice(0,10) !== c.time.slice(0,10) ? " завтра" : ""}`, "сухо, без осадков, влажность невысокая")
    : cell("Сушка белья на улице", "лучше дома", "в ближайшие сутки влажно или возможны осадки"));
  /* garden: soil */
  const sT = at(h.soil_temperature_6cm, i0), sM = at(h.soil_moisture_3_to_9cm, i0);
  if(sT != null){
    let r3 = 0; for(let i = 0; i < 3; i++) r3 += d.precipitation_sum[i] || 0;
    const val = sT < 2 ? "почва холодная" : (sM != null && sM < 0.2 && r3 < 5) ? "нужен полив" : "полив не нужен";
    out.push(cell("Огород", val, `почва ${Tu(sT)}${sM != null ? `, влажность ${Math.round(sM*100)}%` : ""}; осадков за 3 дня ${r3.toFixed(0)} мм`));
  }
  /* snow */
  const depth = c.snow_depth || 0; let snowWeek = 0; for(let i = 0; i < Math.min(7, d.time.length); i++) snowWeek += d.snowfall_sum[i] || 0;
  if(depth > 0 || snowWeek > 0.5) out.push(cell("Снег", depth > 0 ? `${Math.round(depth*100)} см` : "покрова нет", snowWeek > 0.5 ? `за неделю выпадет около ${snowWeek.toFixed(0)} см` : "нового снега не ожидается"));
  /* aurora from Kp */
  if(Math.abs(lat) >= 45 && kpv){
    const need = Math.max(0, Math.ceil((66 - Math.abs(lat))/2.2)), chance = kpN >= need + 1 ? "вероятно" : kpN >= need ? "возможно, низко над горизонтом" : "маловероятно";
    out.push(cell("Северное сияние", chance, `для вашей широты нужен индекс Kp ${need}+, ожидается до ${String(kpN).replace(".",",")}`));
  }
  return out.join("");
}

async function showHistory(){

  const today = w.current.time.slice(0,10), md = today.slice(5), yNow = +today.slice(0,4);
  /* the archive bills long ranges as many requests, so fetch just this date of every year, a few at a time */
  const lastY = Date.parse(today) - 7*864e5 >= Date.parse(`${yNow}-${md}`) ? yNow : yNow - 1, years = [];
  for(let y = lastY; y >= 1940; y--) if(md !== "02-29" || (y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0))) years.push(y);
  const rows = []; let done = 0, failed = 0;
  const prog = () => { const l = body.querySelector(".loading"); if(l) l.textContent = `Загружаю погоду за ${years.length} лет… ${Math.round(done/years.length*100)}%`; };
  const one = async y => {
    const dte = `${y}-${md}`;

      const D = a.daily; if(D?.temperature_2m_max?.[0] != null) rows.push({y, hi:D.temperature_2m_max[0], lo:D.temperature_2m_min[0], p:D.precipitation_sum[0]||0}); }
    catch(e){ failed++; }
    done++; prog();
  };
  for(let i = 0; i < years.length; i += 8){ if(current !== token || !$("#hBack")) return; await Promise.all(years.slice(i, i+8).map(one)); }
  if(current !== token || !$("#hBack")) return;
  rows.sort((a,b) => a.y - b.y);
  if(rows.length < 5){ body.innerHTML += `<div class="err">Для этой точки в архиве мало данных.</div>`; return; }
  const by = y => rows.find(r => r.y === y), dt = new Date(today+"T12:00:00");
  const plural = n => n === 1 ? "год" : n < 5 ? "года" : "лет";
  const agoC = [1,5,10,30,50,80].map(n => [n, by(yNow-n)]).filter(x => x[1]).map(([n,r]) =>
    cell(`${n === 1 ? "Год" : `${n} ${plural(n)}`} назад, ${r.y}`, `${Tc(r.hi)} / ${Tc(r.lo)}`, r.p >= 0.3 ? `осадки ${r.p.toFixed(1)} мм` : "без осадков"));
  const rHi = rows.reduce((m,r) => r.hi > m.hi ? r : m), rLo = rows.reduce((m,r) => r.lo < m.lo ? r : m), rWet = rows.reduce((m,r) => r.p > m.p ? r : m);
  const norm = rows.filter(r => r.y >= 1991 && r.y <= 2020), avg = (arr, k) => arr.reduce((s,r) => s + r[k], 0)/arr.length;
  const nHi = norm.length ? avg(norm,"hi") : avg(rows,"hi"), nLo = norm.length ? avg(norm,"lo") : avg(rows,"lo");
  const fHi = w.daily.temperature_2m_max[0], diff = Math.round(fHi - nHi);
  const dec = {}; rows.forEach(r => { const k = Math.floor(r.y/10)*10; (dec[k] = dec[k] || []).push(r.hi); });
  const decs = Object.entries(dec).map(([k,v]) => [+k, v.reduce((s,x)=>s+x,0)/v.length]);
  /* chart: daytime max on this date, every year, with the trend */
  const W = Math.max(320, rows.length*7), H = 150, pad = 26, mn = Math.min(...rows.map(r=>r.hi)), mx = Math.max(...rows.map(r=>r.hi));
  const X = y => pad + (y - rows[0].y)/(rows[rows.length-1].y - rows[0].y || 1)*(W - pad*2), Y = v => 14 + (1 - (v - mn)/((mx - mn)||1))*(H - 44);
  const n = rows.length, sx = rows.reduce((s,r)=>s+r.y,0), sy = rows.reduce((s,r)=>s+r.hi,0), sxy = rows.reduce((s,r)=>s+r.y*r.hi,0), sxx = rows.reduce((s,r)=>s+r.y*r.y,0);
  const k = (n*sxy - sx*sy)/(n*sxx - sx*sx), b0 = (sy - k*sx)/n, y1 = rows[0].y, y2 = rows[n-1].y;

  for(let y = Math.ceil(y1/20)*20; y <= y2; y += 20) svg += `<text x="${X(y)}" y="${H-6}" text-anchor="middle" font-size="11" font-family="Manrope,sans-serif" style="fill:var(--muted)">${y}</text>`;
  svg += `<text x="${pad}" y="11" font-size="11" font-family="Manrope,sans-serif" style="fill:var(--muted)">до ${Tu(mx)}</text></svg>`;
  const trend = k*10;

    <div class="section"><h4>Как было в этот день</h4><div class="grid">${agoC.join("")}</div></div>
    <div class="section"><h4>Рекорды с ${rows[0].y} года</h4><div class="grid">
      ${cell("Рекорд тепла", Tc(rHi.hi), `в ${rHi.y} году`)}
      ${cell("Рекорд холода", Tc(rLo.lo), `в ${rLo.y} году`)}
      ${cell("Осадки: больше всего", `${rWet.p.toFixed(1)} мм`, `в ${rWet.y} году`)}
      ${cell("Тренд за век", `${trend >= 0 ? "+" : "−"}${Math.abs(trend).toFixed(1).replace(".",",")}° за 10 лет`, trend > 0.1 ? "этот день становится теплее" : trend < -0.1 ? "этот день становится холоднее" : "заметных изменений нет")}
    </div></div>
    <div class="section"><h4>Температура днём по годам <span>пунктир — тренд</span></h4><div class="hist-chart">${svg}</div>
      <div class="grid" style="margin-top:10px">${decs.map(([k,v]) => cell(`${k}-е`, Tc(v), "средний максимум")).join("")}</div></div>
    <div class="snote">Данные: архив реанализа ERA5 (Open-Meteo) с 1940 года, для точки ${fmtCoord(current.lat, current.lon)}.</div>`;
  $("#hBack").onclick = () => renderWeather();
}
